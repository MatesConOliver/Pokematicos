const baseAnswer=answerResult;answerResult=function(x){let r=baseAnswer(x);if(state.session?.mode==='global'||state.session?.caseTest)return r;if(x.q.id===12&&x.q.steps){if(!x.draft.orderFirst)return {missing:true};if(!['power','root'].includes(x.draft.orderFirst))return {ok:false,order:true}}if(x.q.errorFirst){if(!x.draft.errorFirst)return {missing:true};if(x.draft.errorFirst!==x.q.errorFirst)return {ok:false,first:true}}return r};
const priorExercise=exercise;exercise=function(){priorExercise();let s=state.session,x=s?.items[s.index];if(state.screen!=='exercise'||!x||s.mode==='global')return;if(x.q.errorFirst&&!x.finished){let e=app.querySelector('#fields');if(e)e.insertAdjacentHTML('afterbegin',`<div class="note"><strong>${T('¿Dónde aparece el primer error?','Where is the first error?')}</strong><div class="row">${['first','last'].map((id,j)=>btn('errorStep',T(j?'Segunda igualdad':'Primera igualdad',j?'Second equality':'First equality'),`data-id="${id}"`,x.draft.errorFirst===id?'':'secondary')).join('')}</div></div>`)}if(x.feedback&&x.attempts&&s.mode==='auto'&&x.finished&&x.q.id===12&&x.draft.orderFirst&&!['root','power'].includes(x.draft.orderFirst)){let note=app.querySelector('[role="status"].note');if(note)note.textContent=T('La prioridad es la potencia o la raíz. El resultado final no basta.','The power or root must come first. The final answer alone is not enough.')}};
const priorAction=extraAction;extraAction=function(a,b,i,g,id){if(a==='errorStep'){state.session.items[state.session.index].draft.errorFirst=id;save();exercise();return true}return priorAction(a,b,i,g,id)};
function conceptQuestion(i){const data={8:[B('Sin calcular: ¿puede la suma de dos fracciones mayores que 1/2 ser menor que 1?','Without calculating: can two fractions greater than 1/2 add to less than 1?'),B('No','No'),B('Sí','Yes'),B('Cada sumando supera la mitad, por tanto la suma supera 1.','Both addends exceed one half, so their sum exceeds 1.')],9:[B('Si multiplicas una cantidad positiva por 2/3, ¿qué ocurre?','If you multiply a positive amount by 2/3, what happens?'),B('Disminuye','It decreases'),B('Aumenta','It increases'),B('2/3 es menor que 1: tomas solo parte de la cantidad.','2/3 is less than 1: you take only part of the amount.')],10:[B('¿Qué signo tiene una base negativa elevada a un exponente par?','What sign does a negative base raised to an even exponent have?'),B('Positivo','Positive'),B('Negativo','Negative'),B('Cada pareja de factores negativos produce un factor positivo.','Each pair of negative factors gives a positive factor.')],11:[B('¿Puede ser negativa una raíz cuadrada principal exacta?','Can an exact principal square root be negative?'),B('No','No'),B('Sí','Yes'),B('La raíz cuadrada principal siempre es no negativa.','The principal square root is always non-negative.')],14:[B('¿Un decimal infinito es necesariamente irracional?','Must an infinite decimal be irrational?'),B('No','No'),B('Sí','Yes'),B('Un decimal periódico es racional: por ejemplo 1/3.','A recurring decimal is rational: for example 1/3.')],3:[B('¿Puede una cantidad ser el 150 % de otra?','Can a quantity be 150% of another?'),B('Sí','Yes'),B('No','No'),B('150 % = 1,5: una unidad y media.','150% = 1.5: one and a half units.')],19:[B('¿Qué permite eliminar la parte decimal infinita?','What makes it possible to cancel the infinite decimal part?'),B('Que las colas decimales coincidan','Matching decimal tails'),B('Que los multiplicadores sean iguales','Equal multipliers'),B('Las colas iguales se restan y desaparecen; los multiplicadores deben ser distintos.','Matching tails cancel; the multipliers must differ.')]}[i];if(!data)return null;return q(i,data[0],C(data[1],[data[2]]),H('Piensa en el significado, no en un cálculo.','Think about the meaning, not a calculation.',data[3][0],data[3][1]),data[3])}

A[5][3]=B('Corrige los tres tipos de error de forma autónoma e identifica la primera igualdad incorrecta en tres ejercicios distintos.','Correct all three error types independently and identify the first incorrect equality in three distinct tasks.');A[5][6]=s=>level(13,s)>=3&&s.events.errorSteps.length>=3;

function finishMiniTest(){let s=state.session;if(!s?.caseTest)return;let items=s.items;for(let x of items){x.ok=!!answerResult(x).ok;x.finished=true;x.attempts=1;if(!x.ok)queueError(x)}let pass=items.every(x=>x.ok);if(pass&&!state.events.cases.includes(s.caseId))state.events.cases.push(s.caseId);state.events.effort++;let entry={title:s.caseTitle,context:s.caseContext,id:s.caseId,pass,items};state.caseHistory.push(entry);state.session=null;state.caseReport=state.caseHistory.length-1;unlock();go('caseReport')}
function renderCaseReport(){let h=state.caseHistory[state.caseReport];if(!h){go('space',4);return}app.innerHTML=`<section class="panel"><h2>${t(h.title)} · ${h.items.filter(x=>x.ok).length}/3</h2><div class="note ${h.pass?'good':'warn'}">${h.pass?T('✓ Desafío autónomo superado.','✓ Independent challenge passed.'):T('Revisa las respuestas y prueba otra variante.','Review the answers and try a new variant.')}</div><p>${t(h.context)}</p>${state.earned.includes('logr10')?codebtn('logr10'):''}<div class="row">${btn('caseTest',T('Otra variante','Another variant'),`data-id="${h.id}"`,'')}${btn('space',T('Volver a minicasos','Back to mini-cases'),'data-g="4"')}</div></section>${h.items.map((x,j)=>`<section class="panel"><h3>${j+1}. ${x.ok?'✓':'↻'} ${t(x.q.ask)}</h3><p>${T('Tu respuesta','Your answer')}: ${x.q.answer.type==='choice'?t(x.q.answer.choices[Number(x.draft.choice)]||B('Sin respuesta','No answer')):esc([x.draft.num,x.draft.den].filter(Boolean).join('/')||'—')}</p><div class="note">${t(x.q.sol)}</div>${x.q.reason?`<p>${T('Tu explicación','Your explanation')}: ${esc(x.draft.reason||'—')}</p><p class="small">${T('Revisa tu texto. No da puntos de dominio.','Review your writing. No mastery credit.')}</p>${shortReview(x.draft,x.q.id,'case',state.caseReport,j)}`:''}</section>`).join('')}`}
const rRender=render;render=function(){extras();if(state.screen==='caseReport'){header();renderCaseReport();return}rRender()};
const caseAction=extraAction;extraAction=function(a,b,i,g,id){if(a==='caseTest'){if(resumeDraft('caseTest:'+id))return true;parkSession();state.session=newCase(id);state.session.caseTest=true;go('exercise');return true}return caseAction(a,b,i,g,id)};
// use a compact touch-friendly entry strip on numeric tasks. It is a keyboard aid, never a mathematical hint.
let mathFocus='num';document.addEventListener('focusin',e=>{if(e.target.matches('input[type="text"][data-field]'))mathFocus=e.target.dataset.field});
const touchExercise=exercise;exercise=function(){touchExercise();let s=state.session,x=s?.items[s.index];if(state.screen!=='exercise'||!x||x.finished)return;let p=app.querySelector('.panel');if(!p)return;let inputs=[...p.querySelectorAll('input[type="text"][data-field]:not([disabled])')];if(!inputs.length)return;if(!inputs.some(el=>el.dataset.field===mathFocus))mathFocus=inputs[0].dataset.field;let dest=p.querySelector('#fields');if(!dest)return;dest.insertAdjacentHTML('beforeend',`<div class="row keypad" aria-label="${T('Teclas matemáticas','Math keys')}">${['−','/',L()?'.':','].map(k=>btn('mathKey',k,`data-id="${k}"`)).join('')}</div>`)};
const touchAction=extraAction;extraAction=function(a,b,i,g,id){if(a==='mathKey'){let p=app.querySelector('.panel'),inputs=[...p.querySelectorAll('input[type="text"][data-field]:not([disabled])')],el=inputs.find(x=>x.dataset.field===mathFocus)||inputs[0];if(el){let k=id==='−'?'-':id,start=el.selectionStart??el.value.length,end=el.selectionEnd??start;el.setRangeText(k,start,end,'end');el.dispatchEvent(new Event('input',{bubbles:true}));el.focus()}return true}return touchAction(a,b,i,g,id)};

document.addEventListener('input',e=>{let el=e.target;if(el.dataset.labReflection!==undefined&&state.screen==='lab'&&state.lab==='division'){labState.reflection=el.value;save()}if(el.dataset.lab==='j'&&state.screen==='lab'&&state.lab==='line'){let j=Number(el.value);if(Number.isInteger(j)&&j>=-8&&j<=8){labState.j=j;labState.checked=false;let vis=app.querySelector('.visual');if(vis)vis.innerHTML=lineSvg(j);let formula=app.querySelector('.formula');if(formula)formula.hidden=true;save()}}});

unlock();render();
</script></body></html>

`<p>La notación científica permite escribir números muy grandes o muy pequeños de forma abreviada: <strong>coeficiente × potencia de diez</strong>.</p><div class="parts" role="group" aria-label="Partes de 3,25 por 10 elevado a 6"><div class="part coefficient"><strong>3,25</strong><span>Coeficiente</span></div><strong>·</strong><div class="part"><strong>10</strong><span>Base</span></div><div class="part exponent"><strong>6</strong><span>Exponente</span></div></div><p>En esta expresión, el coeficiente es 3,25, la base es 10 y el exponente es 6. El violeta identifica el coeficiente y el verde, el exponente.</p><div class="formula"><span class="coefficient">a</span> · 10<sup class="exponent">n</sup></div><p>Para números positivos, 1 ≤ a &lt; 10 y n es un entero. En tus apuntes, el exponente identifica el orden de magnitud. Solo hay una cifra entera distinta de cero en el coeficiente.</p><div class="example">230 000 = ${p(2.3,5)}<br>Movemos la coma cinco lugares hacia la izquierda. <br>0,00042 = ${p(4.2,-4)}<br>Movemos la coma cuatro lugares hacia la derecha.</div><p>Para volver a decimal, multiplica por la potencia de diez. Un exponente negativo significa dividir entre una potencia de diez.</p>`,
`<p>Un mismo número puede expresarse de muchas maneras. Observa: 2 × 100 = 20 × 10 = 200 × 1.</p><div class="formula">${p(2,2)} = ${p(20,1)} = ${p(200,0)}</div><div class="tip"><strong>Regla de compensación:</strong> si el exponente sube, el coeficiente se divide entre 10 por cada unidad. Si baja, se multiplica por 10 por cada unidad.</div><div class="example">${p(2.5,2)} = ${p(25,1)} = ${p(.25,3)}. Las tres expresiones valen 250, aunque solo la primera está normalizada.</div><div id="sim"></div><div class="example"><strong>Tu ruta de transformación</strong><p>1. Anticipa si el coeficiente aumenta o disminuye.<br>2. Cuenta las unidades entre exponentes.<br>3. Mueve la coma ese número de posiciones.<br>4. Comprueba que conservas el valor.</p><p>De −2 a 1 hay tres unidades: −2 → −1 → 0 → 1. El coeficiente se divide entre 1000.</p></div>`,
`<p>Para sumar o restar, primero necesitamos la misma potencia de diez. Todavía no vamos a operar: solo igualaremos los exponentes.</p><div class="example">${p(2.5,4)} y ${p(3.2,3)}<br>Al mayor: ${p(2.5,4)} y ${p(.32,4)}.<br>Al menor: ${p(25,3)} y ${p(3.2,3)}.</div><p>Los dos métodos son válidos. Fíjate en qué término cambia y en qué dirección se mueve la coma.</p><div id="equalSim"></div>`,
`<p>Con exponentes iguales, suma o resta los coeficientes y conserva la potencia. Si son diferentes, iguala primero. Normaliza al final si es necesario.</p><div class="example">${p(2,3)} + ${p(3,3)} = ${p(5,3)}<br>${p(8,-12)} − ${p(5,-12)} = ${p(3,-12)}</div><div class="example"><strong>Dos caminos, mismo resultado</strong><div class="formula">${p(4.56,24)} − ${p(5.24,23)}</div>Al mayor: ${p(4.56,24)} − ${p(.524,24)} = ${p(4.036,24)}.<br>Al menor: ${p(45.6,23)} − ${p(5.24,23)} = ${p(40.36,23)} = ${p(4.036,24)}.</div><div class="tip">Nunca sumes ni restes los exponentes al sumar o restar números.</div>`,
`<p>En la multiplicación, multiplica los coeficientes y suma los exponentes. En la división, divide los coeficientes y resta los exponentes (numerador menos denominador).</p><div class="example">(${p(6,6)})(${p(4,4)}) = ${p(24,10)} = ${p(2.4,11)}<br><div class="formula">${frac(p(6,9),p(2,5))} = ${p(3,4)}</div><div class="formula">${frac(p(4,5),p(8,8))} = ${p(.5,-3)} = ${p(5,-4)}</div></div><p>Si el coeficiente queda fuera del intervalo [1, 10), vuelve a ajustar la potencia.</p>`,
`<p>Los exponentes negativos siguen las mismas reglas. Recuerda que −2 es mayor que −5. Al restar un exponente negativo, se suma su opuesto.</p><div class="example">${p(4.3,-3)} − ${p(2.5,-4)} = ${p(4.3,-3)} − ${p(.25,-3)} = ${p(4.05,-3)}<br>(${p(2.5,-3)})(${p(4,-2)}) = ${p(10,-5)} = ${p(1,-4)}<br><div class="formula">${frac(p(6,-3),p(2,-5))} = 3 · 10<sup>−3−(−5)</sup> = ${p(3,2)}</div></div><div class="example"><strong>Exponentes de distinto signo</strong><br>(${p(3,2)})(${p(2,-4)}) = ${p(6,-2)}<br>Al multiplicar: 2 + (−4) = −2. Al dividir ${p(6,-3)} entre ${p(2,2)}, el exponente es −3 − 2 = −5.</div><p>La normalización funciona igual: ${p(.48,-3)} = ${p(4.8,-4)}.</p>`,
`<p>En muchas calculadoras, <span class="kbd">EXP</span>, <span class="kbd">EE</span> o <span class="kbd">×10ˣ</span> introduce la potencia de diez. No escribas otro ×10 antes de EXP.</p><div class="example">7,3 · 10<sup>9</sup>: <span class="kbd">7,3</span> <span class="kbd">EXP</span> <span class="kbd">9</span><br>8,64 · 10<sup>−3</sup>: <span class="kbd">8,64</span> <span class="kbd">EXP</span> <span class="kbd">−3</span> (usa la tecla de signo negativo según tu modelo).<br>Una pantalla que muestra 9,46E−3 representa 0,00946.</div><p>En operaciones combinadas: primero paréntesis, después potencias, productos y cocientes, y finalmente sumas y restas. Normaliza el resultado.</p><div class="example">(${p(5.1,4)} + ${p(7.2,3)})² = (${p(5.82,4)})² = ${p(33.8724,8)} = ${p(3.38724,9)}</div>`];

 equal(a,n,b,m,t),
 choice(`Comprueba el resultado:<div class="formula">${p(A,t)} + ${p(B,t)}</div>¿Tienen ahora el mismo exponente?`,['Sí: puedo sumar sus coeficientes','No: todavía hay que igualar'],0,'Mira solo los exponentes en las dos expresiones.',`Ambos exponentes deben ser ${t}.`,`Los dos exponentes son ${t}. Ahora puedes operar ${fmt(A)} + ${fmt(B)} y conservar 10 elevado a ${t}.`)
 ]);return `Has elegido el exponente ${t}. ${first?'El segundo número se conserva; transformarás el primero.':'El primero se conserva; transformarás el segundo.'}`}
function transformFeedback(q,x){if(!q.source||!['convert','equal'].includes(q.source.kind))return '';let [a,n,t]=q.source.kind==='convert'?q.source.args:(()=>{let [a,n,b,m,t]=q.source.args;return n!==t?[a,n,t]:[b,m,t]})();const delta=n-t;if(!delta||x<=0||a<=0||eq(x,q.expected[0]))return '';const k=Math.round(Math.log10(x/a));if(!Number.isFinite(k)||Math.abs(k)>60||!eq(x,clean(a*10**k)))return '';if(k===-delta)return `La respuesta corresponde a mover la coma en sentido contrario. Para compensar, debes moverla hacia la ${delta<0?'izquierda':'derecha'}. `;if(k===0)return 'La respuesta coincide con el coeficiente inicial; todavía falta compensar el cambio del exponente. ';if(Math.sign(k)===Math.sign(delta)){const difference=Math.abs(k)-Math.abs(delta);if(Math.abs(difference)===1)return `La respuesta corresponde a la dirección correcta, pero a una posición ${difference<0?'menos':'de más'}. Necesitas ${Math.abs(delta)} posiciones. `}return ''}
function finalQuestion(kind){const a=ri(11,89)/10,b=ri(11,89)/10,n=ri(-5,6),m=ri(-5,6);let q;if(kind===0)q=Math.random()<.5?decimal(a,n):normalize(val(a,n),null);else if(kind===1)q=convert(a,n,n+pick([-3,-1,1,3]));else if(kind===2||kind===3)q=op(a,Math.max(n,m)+1,b,Math.min(n,m),kind===2?'+':'−');else if(kind===4)q=op(a,n,b,m,'×');else if(kind===5){let [x,y]=pick([[6,2],[4,8],[7.5,2.5],[2.4,8]]);q=op(x,n,y,m,'÷')}else q=combo(ri(0,2),a,b);q.category=['conversion','transformation','addition','subtraction','multiplication','division','combined'][kind];return q}
function random(i,j,g=false){if(i===6)return finalQuestion(j%7);if(i===5&&j%2===1){const a=j%4===3?6:ri(11,89)/10,b=j%4===3?2:ri(11,89)/10;return op(a,-ri(1,4),b,ri(1,3),j%4===3?'÷':'×',g)}return legacyRandom(i,j,g)}
function challengeQueue(){if(level!==6)return Array.from({length:5},(_,j)=>random(level,j));let kinds=[0,1,2,3,4,5,6];for(let k=kinds.length-1;k>0;k--){let j=ri(0,k);[kinds[k],kinds[j]]=[kinds[j],kinds[k]]}return kinds.slice(0,5).map(finalQuestion)}
function equivalent(item){const src=item.source;if(!src)return {...JSON.parse(JSON.stringify(item)),consolidation:true};const args=src.args.slice();if(src.kind==='combo')args[1]=clean(args[1]+.1);else if(src.kind==='recognition'){let a=args[0];args[0]=Math.abs(a)>=10?clean(a+10):Math.abs(a)<1?clean(a/2):clean(Math.min(9.9,a+.1))}else if(['op','normalize','decimal'].includes(src.kind)){const coefficient=Math.abs(norm(args[0])[0]);args[0]=clean(args[0]*(coefficient<5?2:.5))}else args[0]=clean(args[0]+(Number.isInteger(args[0])?(args[0]>=9?-1:1):.1));const constructors={convert,equal,op,decimal,normalize,combo,recognition,direction,positions,commaDirection,positionGuide,guidedConvert,machine,equalGuide};let fresh=constructors[src.kind](...args);fresh.consolidation=true;return fresh}
function currentItem(){const s=session();return s.consolidation||s.queue[s.index]}
function currentQuestion(){const s=session(),item=currentItem();return item.steps?item.steps[s.step]:item}
function canChallenge(){return !!state.practiceDone[level]}
function newSession(phase,queue){return {phase,index:0,step:0,attempts:0,assisted:false,feedback:'',resolved:false,queue,score:0,perfect:0,correct:0,inputs:[],work:[]}}
function session(){return state.sessions[level]||(state.sessions[level]=newSession('learn',fixed[level]()))}
function start(phase){if(phase==='challenge'&&!canChallenge())return;const queue=phase==='practice'?fixed[level]():phase==='challenge'?challengeQueue():Array.from({length:5},(_,j)=>random(level,level===6?ri(0,6):j,true));state.sessions[level]=newSession(phase,queue);save();renderLevel()}
function novaMessage(message){return `<div class="nova-note">${mascot}<p><strong>Nova · </strong>${message}</p></div>`}
function showTheory(){const s=session();if(s.phase==='challenge'&&!s.resolved){s.assisted=true;save()}const dialog=document.createElement('dialog');dialog.id='theoryDialog';dialog.innerHTML=`<div class="dialog-head"><h2>Entrenamiento · ${levels[level][0]}</h2><button id="closeTheory">Volver al ejercicio</button></div>${theory[level]}`;document.body.append(dialog);if(level===1)sim();if(level===2)equalSim();dialog.onclose=()=>{dialog.remove();$('backlearn')?.focus()};$('closeTheory').onclick=()=>dialog.close();dialog.showModal()}
function renderInputs(q,s){if(q.type==='choice')return `<fieldset class="choices"><legend>Elige una respuesta</legend>${q.choices.map((label,i)=>`<label><input type="radio" name="choice" value="${i}" ${s.inputs[0]===String(i)?'checked':''} ${s.resolved?'disabled':''}>${escapeText(label)}</label>`).join('')}</fieldset>`;if(q.type==='machine')return '<div id="machinePanel"></div>';const input=(label,i,cls='')=>`<div class="${cls}"><label for="a${i}">${label}</label><input type="text" inputmode="text" id="a${i}" autocomplete="off" maxlength="100" ${s.resolved?'disabled':''}></div>`;return q.scientific?`<div class="answer scientific-answer">${input('Coeficiente',0,'coefficient-field coefficient')}<div class="power-field"><span class="power-base">· 10</span>${input('Exponente',1,'exponent-field exponent')}</div></div>`:`<div class="answer">${q.labels.map((l,i)=>input(l,i)).join('')}</div>`}
function renderMachine(q){const s=session(),[a,n,t]=q.source.args;if(s.machineExp===undefined)s.machineExp=n;const e=s.machineExp;$('machinePanel').innerHTML=`<div class="sim machine"><div class="machine-legend"><span class="coefficient">Coeficiente</span><span class="exponent">Exponente</span></div><div class="machine-value"><div class="formula">${p(clean(a*10**(n-e)),e)}</div></div><p>Objetivo: exponente <strong>${t}</strong> · Valor original: ${fmt(val(a,n))}</p><div class="actions"><button type="button" id="commaLeft" ${s.resolved||e>=Math.max(n,t)+4?'disabled':''}>← Coma a la izquierda</button><button type="button" id="commaRight" ${s.resolved||e<=Math.min(n,t)-4?'disabled':''}>Coma a la derecha →</button></div><p class="small">Izquierda: coeficiente ÷ 10 y exponente + 1. Derecha: coeficiente × 10 y exponente − 1.</p><button type="button" id="newMachine" class="secondary">Generar otro objetivo similar</button></div>`;const move=d=>{s.machineExp+=d;if(s.machineExp===t){s.resolved=true;s.lastCorrect=true;s.feedback='🌟 Objetivo alcanzado. '+q.solution}save();renderLevel()};$('commaLeft').onclick=()=>move(1);$('commaRight').onclick=()=>move(-1);$('newMachine').onclick=()=>{const replacement=machine(clean(a+.1),n,t);if(s.consolidation)s.consolidation=replacement;else s.queue[s.index]=replacement;resetStep(s);s.assisted=false;s.needsConsolidation=false;save();renderLevel()}}
function renderLevel(){const s=session(),l=levels[level];app.innerHTML=`<section class="hero">${mascot}<div><div class="tag">Misión ${level+1} / 7 · ${l[2]}</div><h2>${l[0]}</h2><p>${l[1]}</p></div></section><div class="steps">${['learn','practice','challenge','complete'].map((x,i)=>`<span class="${s.phase===x?'on':''}">${['1. Entrenamiento','2. Práctica guiada','3. Desafío','4. Recompensa'][i]}</span>`).join('')}</div><div id="content"></div>`;
 if(s.phase==='learn'){$('content').innerHTML=`<section class="panel"><h2>Entrenamiento con Nova</h2>${theory[level]}${novaMessage(level===1?'Primero anticipa el cambio, después cuenta posiciones y comprueba la equivalencia.':'Relaciona cada regla con un ejemplo. Después podrás ponerla en práctica.')}<div class="actions"><button id="practice">Empezar práctica →</button>${canChallenge()?'<button id="jump" class="secondary">Ir al desafío</button>':'<p class="small">Completa una primera ronda de práctica para abrir el desafío.</p>'}</div></section>`;if(level===1)sim();if(level===2)equalSim();$('practice').onclick=()=>start('practice');if($('jump'))$('jump').onclick=()=>start('challenge');return}
 if(s.phase==='complete'){const passed=s.score>=4;$('content').innerHTML=`<section class="panel"><h2>${passed?'🎉 ¡Misión superada!':'Sigue entrenando a tu ritmo'}</h2><p>Has conseguido ${s.score} de 5 ejercicios sin ayudas y al primer intento. ${passed?(level===6?'¡Has completado las siete misiones!':'¡Has desbloqueado la siguiente misión!'):'Necesitas al menos 4 de 5 para desbloquear la siguiente misión. Puedes repetir sin límite.'}</p>${passed?`<div class="stars">${'★'.repeat(state.done[level])}${'☆'.repeat(3-state.done[level])}</div>`:''}${novaMessage(passed?'Has conectado las reglas con su significado. Puedes seguir avanzando o repasar.':'Revisa qué paso te hizo dudar. La práctica sigue disponible, sin límite de tiempo.')}<div class="actions">${passed&&level<6?'<button id="nextlevel">Siguiente misión →</button>':''}<button id="retry">Nuevo desafío</button><button class="secondary" id="extra">Práctica aleatoria</button><button class="secondary" id="review">Repasar teoría</button><button class="secondary" id="fixedPractice">Repetir práctica guiada</button></div></section>`;if($('nextlevel'))$('nextlevel').onclick=()=>go(level+1);$('retry').onclick=()=>start('challenge');$('extra').onclick=()=>start('extra');$('review').onclick=showTheory;$('fixedPractice').onclick=()=>start('practice');return}
 if(!s.consolidation&&s.index>=s.queue.length){finish();return}const item=currentItem(),q=currentQuestion();const title=s.consolidation?'Consolidación · Un ejemplo similar':s.phase==='challenge'?'Desafío del nivel':s.phase==='extra'?'Práctica aleatoria':'Práctica guiada';$('content').innerHTML=`<section class="panel"><div class="tag">${title}${s.consolidation?'':` · Ejercicio ${s.index+1} de ${s.queue.length}`}${item.steps?' · Paso '+(s.step+1)+' de '+item.steps.length:''}</div><div class="track"><span style="width:${100*s.index/s.queue.length}%"></span></div><h2>${s.phase==='challenge'?'Pon a prueba tu poder':s.consolidation?'Afianza este paso':'Vamos paso a paso'}</h2>${item.context?`<div class="context"><div class="context-title">Tu operación de principio a fin</div><div class="formula">${item.context}</div></div>`:''}${s.work?.length?`<ol class="work-trail">${s.work.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${novaMessage(encouragement[(s.index+s.step)%encouragement.length])}<div>${q.prompt}</div><form id="answerForm">${renderInputs(q,s)}<div class="actions">${q.type==='machine'?'':`<button type="submit" ${s.resolved?'disabled':''}>Comprobar</button>`}<button type="button" class="secondary" id="hint" ${s.resolved?'disabled':''}>${(s.hints||0)>=2?'Ver solución explicada':'💡 Necesito una pista'}</button>${s.resolved?'<button type="button" id="advance">Continuar →</button>':''}</div></form><div id="feedback" role="status" aria-live="polite" class="feedback ${s.resolved?(s.lastCorrect?'good':'bad'):s.attempts?'bad':''}">${s.feedback}</div><p class="small">Puedes usar coma o punto decimal y exponentes negativos. ${s.phase==='challenge'?'Necesitas 4 de 5 aciertos sin ayudas y al primer intento.':'Cuando consultes una solución completa, practicarás otro ejemplo similar antes de avanzar.'}</p></section><div class="actions"><button class="secondary" id="backlearn">Consultar teoría y simuladores</button>${s.phase!=='challenge'&&canChallenge()?'<button class="secondary" id="jump">Ir al desafío</button>':''}</div>`;
 if(q.type==='choice')app.querySelectorAll('[name=choice]').forEach(input=>input.onchange=()=>{s.inputs=[input.value];save()});else if(q.type==='machine')renderMachine(q);else q.labels.forEach((_,i)=>{$('a'+i).value=s.inputs[i]||'';$('a'+i).oninput=()=>{s.inputs[i]=$('a'+i).value;save()}});
 $('answerForm').onsubmit=e=>{e.preventDefault();if(q.type!=='machine')check(q)};$('hint').onclick=()=>hint(q);if($('advance')){$('advance').onclick=advance;$('advance').focus()}else if(s.feedback)($('a0')||app.querySelector('[name=choice]'))?.focus();$('backlearn').onclick=showTheory;if($('jump'))$('jump').onclick=()=>start('challenge');
}
function check(q){const s=session();if(s.resolved)return;const a=q.type==='choice'?[parse(app.querySelector('[name=choice]:checked')?.value||'')]:q.labels.map((_,i)=>parse($('a'+i).value));if(a.some(x=>!Number.isFinite(x))||q.scientific&&!Number.isInteger(a[1])){$('feedback').textContent=q.type==='choice'?'Selecciona una opción antes de comprobar.':'Introduce valores numéricos válidos. El exponente debe ser un entero.';return}const rounded=q.rounded?norm(val(Number(q.expected[0].toPrecision(4)),q.expected[1])):null;const matches=expected=>a.every((x,i)=>q.scientific&&i===1?x===expected[i]:eq(x,expected[i]));const normalized=!q.scientific||(a[0]===0?a[1]===0:Math.abs(a[0])>=1&&Math.abs(a[0])<10);const correct=q.methodChoice||normalized&&(matches(q.expected)||rounded&&matches(rounded));if(correct){s.resolved=true;s.lastCorrect=true;const solution=q.methodChoice?chooseMethod(currentItem(),a[0]):q.solution;s.feedback='🌟 '+congratulations[(s.index+s.step)%congratulations.length]+' '+solution;if(!s.assisted&&s.attempts===0){state.streak++;state.best=Math.max(state.streak,state.best)}else state.streak=0}else{s.attempts++;s.assisted=true;state.streak=0;if(s.attempts>=3){reveal(q,s)}else{s.feedback='Todavía no. '+transformFeedback(q,a[0])+(q.scientific&&eq(val(a[0],a[1]),val(...q.expected))?'El valor es equivalente, pero el coeficiente debe estar entre 1 y 10 en valor absoluto. ':'')+(s.attempts===1?q.h1:q.h2)}}save();renderLevel()}
function reveal(q,s){s.resolved=true;s.lastCorrect=false;s.feedback='Solución explicada: '+q.h2+'<br><strong>'+q.solution+'</strong>';if(q.methodChoice){s.feedback+=' '+chooseMethod(currentItem(),0)}if(s.phase!=='challenge')s.needsConsolidation=true;state.streak=0}
function hint(q){const s=session();s.assisted=true;s.hints=(s.hints||0)+1;if(s.hints>=3)reveal(q,s);else s.feedback='💡 '+(s.hints===1?q.h1:q.h2);save();renderLevel()}
function resetStep(s){s.attempts=0;s.hints=0;s.inputs=[];s.feedback='';s.resolved=false;s.machineExp=undefined}
function advance(){const s=session(),item=currentItem(),q=currentQuestion();if(!s.resolved)return;s.itemWrong=s.itemWrong||!s.lastCorrect;s.work=s.work||[];s.work.push(q.methodChoice?s.feedback:q.solution);if(item.steps&&s.step<item.steps.length-1)s.step++;else{if(!s.itemWrong)s.correct++;if(!s.itemWrong&&!s.assisted)s.score++;if(!s.itemWrong&&!s.assisted&&s.attempts===0)s.perfect++;const needs=s.needsConsolidation&&s.phase!=='challenge';if(!s.consolidation)s.index++;s.consolidation=needs?equivalent(item):null;s.step=0;s.assisted=false;s.itemWrong=false;s.needsConsolidation=false;s.work=[]}resetStep(s);save();renderLevel()}
function finish(){const s=session();if(s.phase==='challenge'){if(s.score>=4){const stars=s.perfect===5?3:s.correct===5?2:1;state.done[level]=Math.max(state.done[level]||0,stars)}s.phase='complete';save();renderLevel()}else{state.practiceDone[level]=true;save();$('content').innerHTML=`<section class="panel"><h2>✨ Entrenamiento terminado</h2>${novaMessage('Has recorrido todos los pasos de esta ronda. El desafío ya está disponible.')}<p>Puedes practicar más o resolver cinco ejercicios de forma autónoma.</p><div class="actions"><button id="challenge">Comenzar desafío</button><button class="secondary" id="more">Más práctica aleatoria</button><button class="secondary" id="review">Repasar teoría y simuladores</button><button class="secondary" id="fixedPractice">Repetir práctica guiada</button></div></section>`;$('challenge').onclick=()=>start('challenge');$('more').onclick=()=>start('extra');$('review').onclick=showTheory;$('fixedPractice').onclick=()=>start('practice')}}

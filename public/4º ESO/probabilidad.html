function reasonQuestion(c){const q={cond2x2:['Si elegimos solo entre quienes cumplen B, ¿qué total usamos?','If we choose only among those satisfying B, which total is used?',['Total de la columna B','Total de la fila A','Total de toda la tabla'],['B column total','A row total','Whole table total'],0,'El grupo conocido es B, aunque los casos favorables sean A∩B.','B is the known group, although the favourable cases are A∩B.'],tree:['¿Por qué sumamos los caminos roja-azul y azul-roja?','Why add the red-blue and blue-red paths?',['Son resultados distintos que no ocurren juntos','Las dos extracciones tienen siempre la misma probabilidad'],['They are distinct outcomes that cannot occur together','Both draws always have the same probability'],0,'Cada camino es un resultado diferente y ambos cumplen la pregunta.','Each path is a distinct outcome and both meet the question.'],diag:['Si una persona da positivo, ¿qué grupo debemos mirar para interpretar el resultado?','If someone tests positive, which group must we examine?',['Todas las personas con la condición','Todas las personas con test positivo'],['Everyone with the condition','Everyone testing positive'],1,'Un positivo puede ser verdadero o falso; ambos forman el grupo conocido.','A positive can be true or false; both form the known group.'],alg:['¿Por qué restamos la intersección al calcular la unión?','Why subtract the intersection when calculating the union?',['Porque los sucesos no pueden ocurrir juntos','Porque la parte común se contó dos veces'],['Because the events cannot occur together','Because the overlap was counted twice'],1,'La unión incluye una vez todos los casos de A o B.','The union includes every case in A or B once.'],edge:['Una regla coincide con los resultados de cuatro valores de N. ¿Qué falta para justificarla?','A rule matches four N values. What is missing to justify it?',['Explicar por qué funciona para cualquier N válido','Repetir esos mismos cuatro cálculos'],['Explain why it works for every valid N','Repeat those same four calculations'],0,'Los casos apoyan la conjetura; la explicación general justifica la regla.','Cases support the conjecture; a general explanation justifies the rule.']}[c.kind];return q;}

function goSkill(id,key){const calc=key==='calculate';if(!calc)labState(id).selectedGroup=key;if(id==='monty'){state.activeNav='explora';state.activeExplore='monty';showingHome=false;explicitMontyLab=!calc;if(!calc){labState(id).open||={};labState(id).open.all=true;}else{const e=getExpMonty(),g=exploreGuideState(id,e);g.open=[g.reached===4?4:Math.min(expRecommendation('monty').step,g.reached)];}save();render();if(!calc)$('directMontyLab')?.scrollIntoView({block:'start'});else app.querySelector('.exp-step[open]')?.scrollIntoView({block:'start'});return;}state.activeNav='taller';switchWorkshopTopic(({cond:'cond2x2',tree:'tree',diag:'diag',alg:'alg',edge:'edge'})[id]);const c=state.taller.current;if(!calc){c.helpOpen=true;c.trainOpen=true;}showingHome=false;save();render();if(!calc)app.querySelector('.workshop-help')?.scrollIntoView({block:'start'});else window.scrollTo(0,0);}
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.recommended){goRecommendation();return;}if(d.pause){showingHome=true;save();render();window.scrollTo(0,0);return;}if(d.skillGo){goSkill(...d.skillGo.split(':'));return;}if(d.researchNext){const id=d.researchNext,rec=invRecommendation(id);state.activeNav='investiga';state.activeInv=id;const inv=getInvState(id);inv.stage=rec.step;if(id==='inv3')inv.freeOpen=[rec.step];showingHome=false;save();render();window.scrollTo(0,0);return;}if(d.reasonAnswer!==undefined){const c=state.taller.current;if(!c?.ok||c.reason?.correct)return;const r=c.reason||={attempts:0};r.open=true;r.last=Number(d.reasonAnswer);r.attempts++;r.correct=r.last===reasonQuestion(c)[4];if(r.correct&&r.attempts===1&&!Object.values(c.usedHelp||{}).some(Boolean)){const m=state.mastery[workshopLab(c.kind)]||={cases:[]};m.reasonCases||=[];const sig=exerciseSignature(c);if(!m.reasonCases.includes(sig))m.reasonCases.push(sig);}save();render();}});
app.addEventListener('toggle',e=>{const el=e.target;if(!el.isConnected)return;const d=el.dataset;if(d.freeStage){const inv=getInvState(state.activeInv),n=Number(d.freeStage);inv.freeOpen=el.open?[...new Set([...(inv.freeOpen||[inv.stage]),n])]:(inv.freeOpen||[inv.stage]).filter(x=>x!==n);save();}if(d.workshopHelp&&state.taller.current){state.taller.current.helpOpen=el.open;save();}if(d.labOpen||d.labExample){const [id,key]=(d.labOpen||d.labExample).split(':'),r=labState(id),k=d.labOpen?'open':'examples';r[k]||={};r[k][key]=el.open;if(d.labOpen&&state.activeNav==='taller'&&state.taller.current)state.taller.current.trainOpen=el.open;save();}if(d.reasonOpen!==undefined&&state.taller.current?.reason){state.taller.current.reason.open=el.open;save();}},true);
function recordWork(e){if(showingHome||!['explora','investiga','taller'].includes(state.activeNav))return;const el=e.target.closest('button,input,select,textarea');if(!el)return;const d=el.dataset,keys=Object.keys(d);if(e.type==='click'&&!keys.some(k=>/^(check|lock|condSim|montyDoor|montyAct|montyBatch|urnSim|expTableCheck|exploreNext|invAddcase|invDelcase|invSim|saveJust|approve|labAnswer|labNext|labSpecialCheck|labCell|coachCheck|reasonAnswer|talNext|revPred)/.test(k)))return;if(e.type==='input'&&!keys.some(k=>/^(expcond|expmonty|diag|urn|inv|talF|coachInput|causalText|labSelect)/.test(k)))return;
 const nav=state.activeNav;state.lastWork={nav,id:nav==='explora'?state.activeExplore:nav==='investiga'?state.activeInv:state.taller.current?.kind};if(nav==='taller')state.lastWork.topic=state.taller.topic;
 const quiz=el.closest('[data-lab-quiz-slot]');if(quiz){const id=quiz.dataset.labQuizSlot,g=quizContext(el,id).g;const step=el.closest('[data-explore-step]')?.dataset.exploreStep?.split(':')[1]||el.closest('[data-free-stage]')?.dataset.freeStage||(nav==='investiga'?getInvState(state.activeInv).stage:null);state.lastWork.training={id,group:g[0],stage:step?Number(step):null,key:quiz.closest('[data-lab-open]')?.dataset.labOpen?.split(':')[1]||'all'};}save();}

app.addEventListener('click',recordWork,true);app.addEventListener('input',recordWork,true);

function workshopFeedback(c){const u=c.user;let messages=[];const add=(valid,es,en)=>{if(!valid)messages.push(bi(es,en));};
 if(c.kind==='cond2x2'){add(closeProb(u.pAgB,c.a/(c.a+c.c),.01),'Revisa P(A | B): ¿has elegido el grupo B?','Check P(A | B): did you choose group B?');add(closeProb(u.pBgA,c.a/(c.a+c.b),.01),'Revisa P(B | A): ¿has elegido el grupo A?','Check P(B | A): did you choose group A?');}
 else if(c.kind==='tree'){add(closeProb(u.same,c.exactSame,.01),'Revisa los dos caminos que dan el mismo color.','Check both paths leading to the same colour.');add(closeProb(u.diff,c.exactDiff,.01),'Revisa los dos caminos que dan colores distintos.','Check both paths leading to different colours.');}
 else if(c.kind==='diag'){add(closeProb(u.ppv,c.ppv,.015),'Comprueba cuántos positivos hay en total; incluye los falsos positivos.','Check the total positive results, including false positives.');}
 else if(c.kind==='alg'){add(closeProb(u.union,c.pUnion,.01),'Revisa el recuento de la parte común de A y B.','Check the overlapping part of A and B.');add(u.zeroDen==='undef','¿Es posible elegir un caso de C si P(C) = 0?','Can you choose a case from C if P(C) = 0?');}
 else{add(closeProb(u.ans,c.exact,.006),'Revisa cuántas fichas del primer color quedan tras extraer una.','Check how many matching tokens remain after the first draw.');add(u.simProof==='no','Distingue comprobar casos de justificar una regla general.','Distinguish checking cases from justifying a general rule.');}
 return messages.join(' ');}

render();

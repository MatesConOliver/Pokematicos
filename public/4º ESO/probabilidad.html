<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level Up: Probabilidad · Criterio B (4.º ESO / MYP 5)</title>
<style>
:root{
  --bg:#fffaf5;
  --surface:#ffffff;
  --surface-2:#faf7ff;
  --ink:#30234c;
  --ink-2:#4a3d66;
  --muted:#655a77;
  --line:#d9c9ec;
  --line-soft:#eee5f7;
  --purple:#6741b5;
  --purple-dark:#4a2c89;
  --lav:#eee5ff;
  --mint:#d9f7ec;
  --peach:#ffe1d2;
  --yellow:#fff0b5;
  --cobalt:#6741b5;
  --cobalt-dark:#4a2c89;
  --cobalt-soft:#eee5ff;
  --coral:#c83e3b;
  --coral-soft:#ffe7df;
  --teal:#08715e;
  --teal-soft:#d9f7ec;
  --amber:#9a5b00;
  --amber-soft:#fff0d2;
  --ok:#08715e;
  --pkm:#08715e;
  --pkm-soft:#eefaf5;
  --radius:22px;
  --radius-sm:14px;
  --shadow:0 5px 25px #58407812;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;
  background:radial-gradient(ellipse at top left,#f2e8ff,transparent 45%),radial-gradient(ellipse at top right,#d9f7ec,transparent 45%),var(--bg);
  color:var(--ink);
  font:16.5px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
body.no-anim *,body.no-anim *::before,body.no-anim *::after{transition:none!important;animation:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button,input,select,textarea{font:inherit;color:inherit}
button{
  cursor:pointer;border:0;border-radius:14px;padding:10px 16px;min-height:42px;font-weight:750;
  background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-dark);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  transition:filter .14s ease,transform .1s ease;
}
button:hover:not(:disabled){filter:brightness(1.07)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #15806b;outline-offset:3px}
.mono,.num-cell{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{line-height:1.25;text-wrap:balance}

/* Top Bar: monica/radicales family aesthetic */
header.topbar{
  background:rgba(255,250,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.topbar-inner{
  max-width:1200px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.brand-link{
  font-weight:900;font-size:clamp(20px,2.8vw,25px);letter-spacing:-.03em;color:var(--ink);
  white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center;gap:8px;
}
.nav-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-tabs button{
  background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 0 #e2d8fa;
  padding:8px 13px;min-height:40px;border-radius:12px;white-space:nowrap;flex-shrink:0;font-weight:700;
}
.nav-tabs button:hover:not(:disabled){background:var(--lav)}
.nav-tabs button[aria-current="page"]{color:#fff;background:var(--purple);border-color:var(--purple);box-shadow:0 3px 0 var(--purple-dark)}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}

.lang-toggle{display:inline-flex;background:#eee5ff;padding:4px;border-radius:14px;gap:4px;border:1px solid #d9c9ec}
.lang-toggle button{
  background:transparent;color:var(--ink);box-shadow:none;padding:6px 11px;min-height:34px;
  border-radius:10px;font-size:13.5px;font-weight:700;white-space:nowrap;
}
.lang-toggle button[aria-pressed="true"]{background:var(--purple);color:#fff;box-shadow:0 2px 0 var(--purple-dark)}

.btn-primary{background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-dark)}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 4px 0 #054d40}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 4px 0 #8d2422}
.btn-ghost{background:#fff;color:var(--purple);border:1px solid #c9b8ee;box-shadow:0 3px 0 #e2d8fa}
.btn-ghost:hover:not(:disabled){background:var(--surface-2)}
.btn-ghost[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 2px 0 var(--purple-dark)}
button.pkm-trigger.has-id{background:var(--pkm-soft);border-color:var(--pkm);color:var(--pkm);box-shadow:0 3px 0 #bfe6d8}

.toolbar-strip{
  max-width:1200px;margin:14px auto 0;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.meta-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.seg-group{display:inline-flex;background:#eee5ff;padding:4px;border-radius:14px;border:1px solid #d9c9ec;gap:4px;flex-wrap:wrap}
.seg-group button{
  min-height:34px;padding:6px 12px;font-size:13.5px;background:transparent;color:var(--ink);
  border-radius:10px;box-shadow:none;font-weight:700;
}
.seg-group button[aria-pressed="true"]{background:var(--purple);color:#fff;box-shadow:0 2px 0 var(--purple-dark)}

main{max-width:1200px;margin:0 auto;padding:16px 20px 64px}
.notice{max-width:1200px;margin:8px auto 0;padding:10px 16px;border-radius:14px;background:var(--amber-soft);border:1px solid #f0d08a;font-size:.9rem;color:#7a4400;font-weight:700}
.notice:empty{display:none}

.panel{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:24px;
  padding:clamp(18px,2.8vw,28px);box-shadow:var(--shadow);margin-top:14px;
}
.subpanel{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.divider{height:1px;background:var(--line-soft);margin:18px 0;border:0}

/* Nova Hero Banner & Guidance Notes */
.hero{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  background:linear-gradient(120deg,#eee5ff,#fff0d9);
  border:2px solid #fff;border-radius:28px;padding:24px;margin:0 0 18px;
  box-shadow:0 8px 25px #58407815;
}
.mascot{flex:none;width:112px;height:112px}
.hero-kicker{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--purple);text-transform:uppercase}
.hero h1{margin:4px 0 8px;font-size:clamp(24px,3.2vw,31px);line-height:1.18;letter-spacing:-.02em}
.hero p{margin:0 0 12px;color:var(--muted);max-width:64ch}
.track{height:14px;background:#e4d9f1;border-radius:20px;overflow:hidden;margin:8px 0 14px}
.track span{display:block;height:100%;background:linear-gradient(90deg,#8759df,#20a88b);transition:width .3s}
.hero-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:rgba(255,255,255,.78);border:1px solid #fff;border-radius:16px;padding:10px 14px}
.kpi .k{display:block;font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{display:block;font-size:21px;font-weight:900;color:var(--ink);font-family:var(--mono);margin-top:2px}
.nova-note{
  display:flex;align-items:center;gap:12px;background:#eef9f4;border:1px solid #bfe6d8;
  border-radius:16px;padding:12px 16px;margin:12px 0;
}
.nova-note .mascot{width:46px;height:46px}
.nova-note p{margin:0;font-size:14.5px}

/* Pastel Interactive Selection Cards */
.exp-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.inv-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.pastel-tab{
  text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  padding:14px 16px;border-radius:20px;border:2px solid #fff;color:var(--ink);
  box-shadow:0 4px 16px #58407812;white-space:normal;min-height:auto;width:100%;
}
.pastel-tab:nth-child(4n+1){background:var(--lav)}
.pastel-tab:nth-child(4n+2){background:var(--mint)}
.pastel-tab:nth-child(4n+3){background:var(--peach)}
.pastel-tab:nth-child(4n+4){background:var(--yellow)}
.pastel-tab[aria-pressed="true"]{outline:3px solid var(--purple);outline-offset:2px;box-shadow:0 6px 20px #6741b529}
.pastel-tab .pt-kicker{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--purple);text-transform:uppercase}
.pastel-tab .pt-title{font-size:16px;font-weight:800;line-height:1.25}
.pastel-tab .pt-desc{font-size:12.5px;font-weight:650;line-height:1.35;color:#51436c;margin-top:3px}

.two-zone{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.field-input,select.field-input,textarea.field-input{
  width:100%;padding:10px 12px;min-height:42px;border:2px solid #cbbbe9;border-radius:12px;background:#fff;color:var(--ink)
}
textarea.field-input{min-height:84px;resize:vertical}
.cell-input{
  width:100%;min-width:68px;padding:6px 8px;min-height:36px;border:2px solid #cbbbe9;
  border-radius:10px;text-align:center;background:#fff;font-family:var(--mono);font-variant-numeric:tabular-nums
}
.cell-input[readonly]{background:var(--surface-2);color:var(--ink-2)}

.table-wrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);text-align:center}
th:last-child,td:last-child{border-right:0}
tr:last-child td,tr:last-child th{border-bottom:0}
thead th,tbody th{background:#f7f1ff;font-weight:800;color:var(--ink)}

.status-txt{font-size:.86rem;font-weight:800;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:30px}
.st-pending{background:#fff;color:var(--muted);border:1px solid var(--line)}
.st-guided{background:var(--amber-soft);color:var(--amber);border:1px solid #f0d08a}
.st-auto{background:var(--teal-soft);color:var(--teal);border:1px solid #a7dfcc}
.st-cons{background:#fff6cf;color:#7a4f00;border:1px solid #edd072}

.callout{padding:12px 15px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:.94rem;margin-top:10px}
.callout.ok{background:var(--teal-soft);border-color:#9bd8c1;color:#054d40}
.callout.warn{background:var(--amber-soft);border-color:#f0d08a;color:#7a4400}
.callout.err{background:var(--coral-soft);border-color:#f5b7aa;color:#7a1c14}
.callout.info{background:#f5efff;border-color:#cbbbe9;color:var(--ink)}

.choice-opt{
  display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:2px solid #d9c9ec;
  border-radius:14px;background:#fff;cursor:pointer;text-align:left
}
.choice-opt:has(input:checked){border-color:var(--purple);background:var(--lav)}
.choice-opt input{width:19px;height:19px;margin-top:2px;accent-color:var(--purple);flex-shrink:0}

.svg-stage{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
.svg-stage svg{display:block;max-width:100%;height:auto;margin:0 auto}

.door-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
.door-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:18px 10px;min-height:118px;border:2px solid #d9c9ec;border-radius:18px;background:#fff;color:var(--ink);
  box-shadow:0 4px 0 #e2d8fa;white-space:normal;
}
.door-btn.chosen{border-color:var(--purple);background:var(--lav);box-shadow:0 4px 0 #c9b8ee}
.door-btn.opened{border-color:#d9a441;background:var(--yellow);box-shadow:0 4px 0 #e6cc7a}
.door-btn.win{border-color:var(--teal);background:var(--mint);box-shadow:0 4px 0 #9bd8c1}

.ev-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 14px;border:1px solid #e5daf5;border-radius:16px;background:#faf7ff;margin-bottom:10px;
}
.ev-row:last-child{margin-bottom:0}

.code-box{background:#f7f1ff;border:2px dashed #b49be6;border-radius:16px;padding:16px;text-align:center;margin:14px 0}
.code-value{font-family:var(--mono);font-size:clamp(16px,3vw,21px);font-weight:800;letter-spacing:.06em;word-break:break-all;user-select:all}

dialog{width:min(840px,calc(100% - 24px));max-height:90dvh;overflow:auto;border:1px solid #d9c9ec;border-radius:24px;padding:0;background:var(--bg);color:var(--ink);box-shadow:0 15px 60px #30234c44}
dialog::backdrop{background:#30234c88}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--bg);z-index:2}
.dlg-body{padding:18px 22px}

footer{max-width:1200px;margin:0 auto;padding:18px 20px 36px;border-top:1px solid var(--line-soft);font-size:.86rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media(max-width:960px){
  .two-zone,.grid-2,.grid-3,.grid-4,.exp-tiles,.inv-tiles{grid-template-columns:minmax(0,1fr)}
  .two-zone>*,.grid-2>*,.grid-3>*,.grid-4>*{min-width:0}
  .hero-kpis{grid-template-columns:1fr}
}
@media(max-width:650px){
  .topbar-inner{padding:10px 14px;gap:10px}
  .header-actions{width:100%;min-width:0;flex:1 1 100%;justify-content:flex-start}
  .hero{padding:16px;gap:14px}
  .mascot{width:80px;height:80px}
  button{min-height:44px;max-width:100%;white-space:normal;overflow-wrap:anywhere}
}
@media print{
  header.topbar,.toolbar-strip,footer,button,.no-print{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .panel{border:0;box-shadow:none;padding:0}
  body.printing-notebook header,body.printing-notebook main,body.printing-notebook footer,
  body.printing-notebook .toolbar-strip,body.printing-notebook #saveNotice{display:none!important}
  body.printing-notebook dialog[open]{display:block!important;position:static!important;max-height:none!important;
    width:100%!important;max-width:100%!important;overflow:visible!important;border:0!important;box-shadow:none!important}
  body.printing-notebook dialog .dlg-head{display:none!important}
  body.printing-notebook dialog .dlg-body{padding:0!important}
}

/* A calm entry point, shared by both Level Up apps. */
header.topbar{position:static;background:transparent;backdrop-filter:none;border:0}
.topbar-inner{max-width:1040px;padding:24px 20px 12px;gap:16px}
.brand-link{font-size:clamp(25px,4vw,38px);white-space:normal;line-height:1.15;letter-spacing:-.04em}
body{background:radial-gradient(ellipse at top left,#f2e8ff,transparent 48%),radial-gradient(ellipse at top right,#d9f7ec,transparent 48%),#fffaf5;background-attachment:fixed}
body[data-screen="home"] .main-nav,body[data-screen="home"] .nav-tabs,body[data-screen="home"] .toolbar-strip{display:none}
.home-welcome{display:flex;align-items:center;gap:22px;padding:26px;background:linear-gradient(120deg,#eee5ff,#fff0d9);border:2px solid white;border-radius:28px;margin:12px 0 22px;box-shadow:0 8px 25px #58407815}
.home-welcome .mascot{width:106px;height:106px;flex:none}
.home-welcome h1{font-size:clamp(25px,4vw,34px);margin:0 0 8px;line-height:1.2}
.home-welcome p{margin:0;color:#655a77}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.home-choice{display:flex;flex-direction:column;align-items:flex-start;white-space:normal;text-align:left;padding:24px;border-radius:24px;border:2px solid white;box-shadow:0 5px 18px #58407812;color:#30234c;gap:8px;min-width:0}
.home-choice:nth-child(4n+1){background:#eee5ff}
.home-choice:nth-child(4n+2){background:#d9f7ec}
.home-choice:nth-child(4n+3){background:#ffe1d2}
.home-choice:nth-child(4n+4){background:#fff0b5}
.home-choice .home-icon{font-size:34px;line-height:1.3}
.home-choice strong{font-size:21px}
.home-choice .home-desc{font-size:15px;font-weight:400;line-height:1.55}
.home-focus{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.home-focus-label{width:100%;font-size:11px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:#6741b5}
.focus-chip{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#fffaf0;border:1px solid #fff;color:#463760;font-size:12px;font-weight:750;line-height:1.2}
.math-inline{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:1.12em;vertical-align:-.15em;color:var(--ink)}
.math-display{display:block;width:max-content;max-width:100%;margin:8px auto;font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:1.18rem;color:var(--ink)}
.formula-card{overflow-x:auto;margin:10px 0;padding:10px 14px;border:1px solid #d8caef;border-radius:14px;background:#fbf8ff;text-align:center}
.home-choice .home-enter{margin-top:10px;color:#6741b5;font-size:15px}
.home-resume{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:22px}
.home-resume p{font-size:14px;color:#655a77;margin:0}
#homeMenuBtn{font-size:14px;padding:9px 14px;min-height:44px;background:white;color:#6741b5;border:1px solid #c9b8ee;box-shadow:0 3px 0 #e2d8fa}
#app:focus{outline:none}
@media(max-width:600px){.home-grid{grid-template-columns:1fr}.home-choice{padding:20px;gap:5px}.home-welcome{padding:18px;gap:12px;align-items:flex-start}.home-welcome .mascot{width:68px;height:68px}.home-welcome h1{font-size:25px}.home-choice .home-icon{font-size:28px}.topbar-inner{padding:20px 16px 8px}}
@media print{.home-resume,#homeMenuBtn{display:none}}

/* Progressive investigation notebook */
.inv-stage-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.inv-stage-btn{white-space:normal;min-width:0;text-align:left;justify-content:flex-start;align-items:flex-start;flex-direction:column;gap:3px;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 0 #e2d8fa;padding:11px 12px;line-height:1.3}
.inv-stage-btn[aria-current="step"]{background:var(--lav);outline:2px solid var(--purple);outline-offset:1px}
.inv-stage-btn small{font-size:.73rem;font-weight:650;color:var(--muted)}
.inv-stage-btn .step-number{font-size:.76rem;color:var(--purple);font-weight:850}
.inv-stage-content{max-width:860px;margin:0 auto}
.inv-stage-content.wide{max-width:none}
.inv-stage-content>.subpanel{margin-top:0}
.inv-stage-footer{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.inv-stage-footer button{white-space:normal}
.inv-support{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px 15px;background:var(--surface-2)}
.inv-support summary{cursor:pointer;font-weight:750;color:var(--purple)}
.inv-support[open] summary{margin-bottom:10px}
.inv-review{margin-top:14px;padding:12px;border:1px solid #bfe6d8;background:#eef9f4;border-radius:14px}
.inv-review .row{margin-top:8px}
.inv-review button{white-space:normal}
.inv-case-summary{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.inv-case-summary span{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.85rem}

.exp-welcome{margin:0 0 12px}.exp-welcome h1{margin:0;font-size:clamp(1.5rem,3vw,2rem)}.exp-welcome p{margin:4px 0;color:var(--muted)}

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const app = $('app');
const KEY = 'laboratorio-probabilidad-autonomia-v3';
const PKM_SOURCE = 'Probab';
const LENGTHY_JUSTIFICATION = 35;
const TALLER_TOPIC_IDS = ['mix', 'cond2x2', 'tree', 'diag', 'alg', 'edge'];

function escapeText(x) {
  return String(x == null ? '' : x).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[ri(0, arr.length - 1)]; }
function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
function gcd(a, b) { a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b)); while (b) [a, b] = [b, a % b]; return a || 1; }
function simpFrac(n, d) {
  if (d === 0) return null;
  if (n === 0) return { n: 0, d: 1 };
  const s = (n < 0) !== (d < 0) ? -1 : 1;
  const g = gcd(n, d);
  return { n: s * Math.abs(Math.round(n)) / g, d: Math.abs(Math.round(d)) / g };
}
function roundTo(n, d = 4) {
  if (!Number.isFinite(n)) return NaN;
  const f = 10 ** d;
  return Math.round((n + Number.EPSILON) * f) / f;
}
function L() { return state?.lang === 'en' ? 'en' : 'es'; }
function fmt(n, d = 3) {
  if (!Number.isFinite(n)) return '—';
  return roundTo(n, d).toLocaleString(L() === 'en' ? 'en-US' : 'es-ES', { useGrouping: false, maximumFractionDigits: d });
}
function mathProb(eventName, givenName = '', display = false) {
  const given = givenName ? `<mo stretchy="false">|</mo><mtext>${escapeText(givenName)}</mtext>` : '';
  return `<math xmlns="http://www.w3.org/1998/Math/MathML" class="${display ? 'math-display' : 'math-inline'}" aria-label="P(${escapeText(eventName)}${givenName ? ' dado ' + escapeText(givenName) : ''})"><mrow><mi mathvariant="normal">P</mi><mo>(</mo><mtext>${escapeText(eventName)}</mtext>${given}<mo>)</mo></mrow></math>`;
}
function mathFrac(num, den, display = false) {
  return `<math xmlns="http://www.w3.org/1998/Math/MathML" class="${display ? 'math-display' : 'math-inline'}"><mfrac><mrow>${num}</mrow><mrow>${den}</mrow></mfrac></math>`;
}
function mathSymbol(name) { return `<mi>${escapeText(name)}</mi>`; }
function mathNumber(value) { return `<mn>${escapeText(value)}</mn>`; }

function mathRulePreview(raw) {
  const original = String(raw || '').trim();
  if (!original) return '';
  const clean = original.replace(/^P\(N\)\s*=\s*/i, '').replace(/,/g, '.').replace(/\s+/g, '');
  const tokens = clean.match(/(?:\d+(?:\.\d+)?|[nN]|[()+\-*/^])/g) || [];
  if (!clean || tokens.join('') !== clean || tokens.length > 100) return '';
  let i = 0;
  const current = () => tokens[i];
  const atom = () => {
    const t = tokens[i++];
    if (t === '(') {
      const body = add();
      if (tokens[i++] !== ')') throw new Error('Missing closing parenthesis');
      return `<mrow><mo>(</mo>${body}<mo>)</mo></mrow>`;
    }
    if (t === '+' || t === '-') return `<mrow><mo>${t}</mo>${atom()}</mrow>`;
    if (/^[nN]$/.test(t || '')) return '<mi>N</mi>';
    if (/^\d+(?:\.\d+)?$/.test(t || '')) return mathNumber(t);
    throw new Error('Invalid term');
  };
  const power = () => {
    let lhs = atom();
    while (current() === '^') { i++; lhs = `<msup>${lhs}${atom()}</msup>`; }
    return lhs;
  };
  const mul = () => {
    let lhs = power();
    while (i < tokens.length) {
      const t = current();
      if (t === '*' || t === '/') {
        i++;
        const rhs = power();
        lhs = t === '/' ? `<mfrac>${lhs}${rhs}</mfrac>` : `<mrow>${lhs}<mo>·</mo>${rhs}</mrow>`;
      } else if (t === '(' || t === 'N' || t === 'n' || /^\d/.test(t || '')) {
        lhs = `<mrow>${lhs}<mo>·</mo>${power()}</mrow>`;
      } else break;
    }
    return lhs;
  };
  const add = () => {
    let lhs = mul();
    while (current() === '+' || current() === '-') {
      const t = tokens[i++]; lhs = `<mrow>${lhs}<mo>${t === '-' ? '−' : '+'}</mo>${mul()}</mrow>`;
    }
    return lhs;
  };
  try {
    const result = add();
    if (i !== tokens.length) return '';
    return `<div class="formula-card"><math xmlns="http://www.w3.org/1998/Math/MathML" class="math-display"><mrow><mi mathvariant="normal">P</mi><mo>(</mo><mi>N</mi><mo>)</mo><mo>=</mo>${result}</mrow></math></div>`;
  } catch { return ''; }
}


/* Accepts equivalent fractions "a/b", comma/dot decimals, percentages "40%", or simple arithmetic like "(6/36)/(11/36)" */
function parseProb(raw) {
  if (typeof raw === 'number') return Number.isFinite(raw) ? raw : NaN;
  const s0 = String(raw == null ? '' : raw).trim().replace(/\s+/g, '').replace(/,/g, '.');
  if (!s0) return NaN;
  const isPct = s0.endsWith('%');
  const s = isPct ? s0.slice(0, -1) : s0;
  if (!s) return NaN;
  if (/^[0-9.+\-*/()]+$/.test(s)) {
    try {
      const val = Function(`"use strict";return (${s})`)();
      if (Number.isFinite(val)) return isPct ? val / 100 : val;
    } catch { return NaN; }
  }
  return NaN;
}

function closeProb(raw, exact, tol = 0.005) {
  const u = parseProb(raw);
  if (!Number.isFinite(u) || !Number.isFinite(exact)) return false;
  if (exact === 0) return Math.abs(u) < 1e-9;
  if (exact === 1) return Math.abs(u - 1) < 1e-9;
  return Math.abs(u - exact) <= tol;
}

/* Safe algebraic evaluator for student rules in terms of N (e.g. "(N/2 - 1)/(N - 1)", "(n-2)/(2n-2)") */
function evalRuleN(exprRaw, N) {
  let s = String(exprRaw == null ? '' : exprRaw).trim().replace(/,/g, '.').replace(/\s+/g, '');
  s = s.replace(/^P\([nN]\)=/i, '');
  if (!s) return NaN;
  // Support implicit multiplication like 2N, 2(N-1), )N, )(
  s = s.replace(/[nN]/g, 'N')
       .replace(/(\d)(N|\()/g, '$1*$2')
       .replace(/(\)|N)(\d|\()/g, '$1*$2')
       .replace(/\)\(/g, ')*(')
       .replace(/\^/g, '**');
  if (!/^[0-9N+\-*/().]+$/.test(s)) return NaN;
  try {
    const fn = Function('N', `"use strict";return (${s});`);
    const v = fn(N);
    return Number.isFinite(v) ? v : NaN;
  } catch { return NaN; }
}

/* Pokemáticos Deterministic Reward Code Encoder (src/utils/rewardCodeUtils.js compatible) */
function pkmCrc8(buf) {
  let c = 0xFF;
  for (let i = 0; i < buf.length; i++) {
    c ^= buf[i];
    for (let j = 0; j < 8; j++) c = (c & 0x80) ? (((c << 1) ^ 0x07) & 0xFF) : ((c << 1) & 0xFF);
  }
  return c ^ 0xFF;
}
function pkmCrc32(str) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < str.length; i++) {
    c ^= (str.charCodeAt(i) & 0xFF);
    for (let j = 0; j < 8; j++) c = (c >>> 1) ^ ((c & 1) ? 0xEDB88320 : 0);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function generateRewardCode(studentId, sourceId, activityId) {
  if (!studentId || !sourceId || !activityId) throw new Error('Missing code parameters');
  const payload = [0x01], h = pkmCrc32(studentId);
  payload.push((h >> 24) & 0xFF, (h >> 16) & 0xFF, (h >> 8) & 0xFF, h & 0xFF);
  const s = sourceId.substring(0, 6).padEnd(6, ' '), a = activityId.substring(0, 6).padEnd(6, ' ');
  for (let i = 0; i < 6; i++) payload.push(s.charCodeAt(i));
  for (let i = 0; i < 6; i++) payload.push(a.charCodeAt(i));
  payload.push(pkmCrc8(new Uint8Array(payload)));
  let n = 0n;
  for (const b of payload) n = (n << 8n) | BigInt(b);
  const b36 = n.toString(36).toUpperCase().padStart(28, '0');
  return `${b36.slice(0, 4)}-${b36.slice(4, 8)}-${b36.slice(8, 12)}-${b36.slice(12, 16)}-${b36.slice(16, 20)}-${b36.slice(20, 24)}-${b36.slice(24, 28)}`;
}

const HUELLAS_META = [
  { id: 'huePre', completeId: 'huePrC', icon: '🔮', max: 4, es: { name: 'Revisión de predicción', desc: 'Comparar tu predicción inicial con evidencia experimental o modelo y anotar una revisión.' }, en: { name: 'Prediction revision', desc: 'Compare an initial prediction with evidence and log a revision.' } },

function validateSave(raw, opts = {}) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw) || raw.version !== 3) throw new Error('Invalid save');
  const s = blankState(false);
  s.lang = raw.lang === 'en' ? 'en' : (opts.preserveLang === 'en' ? 'en' : 'es');
  s.publicId = typeof raw.publicId === 'string' ? raw.publicId.trim().slice(0, 128) : (opts.preserveId || '');
  if (!s.publicId && opts.preserveId) s.publicId = opts.preserveId;
  if (raw.teacherReview?.method === 'code') { /* Old local codes are not independent teacher evidence. */ }
  if(raw.learning && typeof raw.learning==='object' && !Array.isArray(raw.learning)) s.learning=raw.learning;
  if(raw.mastery && typeof raw.mastery==='object' && !Array.isArray(raw.mastery)) s.mastery=raw.mastery;
  if(raw.traceKeys && typeof raw.traceKeys==='object' && !Array.isArray(raw.traceKeys)) s.traceKeys=raw.traceKeys;
  if(raw.lastWork && ['explora','investiga','taller'].includes(raw.lastWork.nav)) s.lastWork=raw.lastWork;
  s.pairMode = Boolean(raw.pairMode);
  s.skipAnim = Boolean(raw.skipAnim);
  s.activeNav = ['explora', 'investiga', 'taller', 'evidencias'].includes(raw.activeNav) ? raw.activeNav : 'explora';
  s.activeExplore = ['cond', 'monty', 'diag', 'urn'].includes(raw.activeExplore) ? raw.activeExplore : 'cond';
  s.activeInv = ['inv1', 'inv2', 'inv3'].includes(raw.activeInv) ? raw.activeInv : 'inv1';
  s.lastSessionDate = typeof raw.lastSessionDate === 'string' ? raw.lastSessionDate.slice(0, 16) : todayKey();
  if (raw.huellas && typeof raw.huellas === 'object') {
    for (const h of HUELLAS_META) {
      const v = Number(raw.huellas[h.id]);
      if (Number.isInteger(v) && v >= 0) s.huellas[h.id] = Math.min(v, h.max);
    }
  }
  const validSellos = new Set(['pending', 'guided', 'autonomous', 'consolidated', 'pending_human']);
  if (raw.sellos && typeof raw.sellos === 'object') {
    for (const m of SELLOS_META) {
      if (validSellos.has(raw.sellos[m.id])) s.sellos[m.id] = raw.sellos[m.id];
    }
  }
  if (raw.explore && typeof raw.explore === 'object' && !Array.isArray(raw.explore)) s.explore = raw.explore;
  if (raw.investigations && typeof raw.investigations === 'object' && !Array.isArray(raw.investigations)) s.investigations = raw.investigations;
  if (raw.taller && typeof raw.taller === 'object' && !Array.isArray(raw.taller)) {
    s.taller = { ...s.taller, ...raw.taller };
    if(!s.taller.drafts || typeof s.taller.drafts!=='object') s.taller.drafts={};
    if (!Array.isArray(s.taller.errorQueue)) s.taller.errorQueue = [];
    if (!TALLER_TOPIC_IDS.includes(s.taller.topic)) s.taller.topic = 'mix';
    for (const k of ['solved', 'autonomous', 'withHelp']) {
      if (!Number.isInteger(s.taller[k]) || s.taller[k] < 0) s.taller[k] = 0;
    }
  }
  if (raw.teacherReview && typeof raw.teacherReview === 'object') {
    s.teacherReview = {
      date: typeof raw.teacherReview.date === 'string' ? raw.teacherReview.date.slice(0, 16) : todayKey(),
      reviewer: typeof raw.teacherReview.reviewer === 'string' ? raw.teacherReview.reviewer.trim().slice(0, 60) : '',
      note: typeof raw.teacherReview.note === 'string' ? raw.teacherReview.note.trim().slice(0, 400) : '',
      method: raw.teacherReview.method === 'code' ? 'code' : 'review',
      invId: ['inv1', 'inv2', 'inv3'].includes(raw.teacherReview.invId) ? raw.teacherReview.invId : ''
    };
  }
  if (s.teacherReview?.invId && s.investigations[s.teacherReview.invId]?.justSaved) {
    const inv = s.investigations[s.teacherReview.invId];
    if (!inv.manualReviews) inv.manualReviews = { justification: { date: s.teacherReview.date } };
  }
  return s;
}

function awardHuella(id, context) {

function getExpCond() {
  if (!state.explore.cond) {
    state.explore.cond = {
      Npop: 36, predA: '', predB: '', predLocked: false, predRevised: false, predRevision: '',
      series: { '36': { n: 0, lie: 0, truthAcc: 0, truthSafe: 0, last: null }, '72': { n: 0, lie: 0, truthAcc: 0, truthSafe: 0, last: null } },
      table: { lieAcc: '', truthAcc: '', truthSafe: '' },
      q: { pAcGivenTruth: '', pTruthGivenAc: '', pImpossible: '', causal: '' },
      checkedTab: null, checkedQ: null, repView: 'tree'
    };
  }
  return state.explore.cond;
}
function runCondSim(times) {
  const c = getExpCond();
  if (!c.predLocked) return;
  const key = String(c.Npop);
  if (!c.series[key]) c.series[key] = { n: 0, lie: 0, truthAcc: 0, truthSafe: 0, last: null };
  const s = c.series[key];
  let lastRun = null;
  for (let i = 0; i < times; i++) {
    const d1 = ri(1, 6);
    if (d1 === 6) {
      s.lie += 1;
      lastRun = { d1, d2: null, cat: 'lie' };
    } else {
      const d2 = ri(1, 6);
      if (d2 === 1) { s.truthAcc += 1; lastRun = { d1, d2, cat: 'truthAcc' }; }
      else { s.truthSafe += 1; lastRun = { d1, d2, cat: 'truthSafe' }; }
    }
    s.n += 1;
  }
  s.last = lastRun;
  save(); render();
}

function getExpMonty() {
  if (!state.explore.monty) {
    state.explore.monty = {
      predA: '', predB: '', predLocked: false, predRevised: false, predRevision: '',
      game: { prize: ri(0, 2), chosen: -1, opened: -1, phase: 'pick', finalChoice: -1, won: null },
      seriesByDoors: {
        '3': { keep: { n: 0, wins: 0 }, switch: { n: 0, wins: 0 } },
        '100': { keep: { n: 0, wins: 0 }, switch: { n: 0, wins: 0 } }
      },
      doorsMode: 3,
      q: { pWinSwitch: '', pSwitchGivenCar: '', needDist: '' },
      checkedQ: null
    };
  }
  const m = state.explore.monty;
  if (!m.seriesByDoors) {
    m.seriesByDoors = {
      '3': {
        keep: m.keepSeries || { n: 0, wins: 0 },
        switch: m.switchSeries || { n: 0, wins: 0 }
      },
      '100': { keep: { n: 0, wins: 0 }, switch: { n: 0, wins: 0 } }
    };
    delete m.keepSeries;
    delete m.switchSeries;
  }
  for (const doors of ['3', '100']) {
    if (!m.seriesByDoors[doors]) m.seriesByDoors[doors] = { keep: { n: 0, wins: 0 }, switch: { n: 0, wins: 0 } };
  }
  return m;
}
function montySeries(m, doors = m.doorsMode) {
  const key = String(doors);
  if (!m.seriesByDoors[key]) m.seriesByDoors[key] = { keep: { n: 0, wins: 0 }, switch: { n: 0, wins: 0 } };
  return m.seriesByDoors[key];
}
function runMontyBatch(strategy, times) {
  const m = getExpMonty();
  if (!m.predLocked) return;
  const doors = m.doorsMode;
  const series = montySeries(m, doors);
  const target = strategy === 'switch' ? series.switch : series.keep;
  for (let i = 0; i < times; i++) {
    const prize = ri(0, doors - 1);
    const chosen = ri(0, doors - 1);
    const win = strategy === 'switch' ? (chosen !== prize) : (chosen === prize);
    target.n += 1;
    if (win) target.wins += 1;
  }
  save(); render();
}

function getExpDiag() {
  if (!state.explore.diag) {
    state.explore.diag = {
      prevPct: 1, sensPct: 95, specPct: 95, popN: 10000,
      table: { tp: '', fn: '', fp: '', tn: '' },
      pCondGivenPos: '', comparison: '', predInit: '',
      checked: null
    };
  }
  return state.explore.diag;
}

function getExpUrn() {
  if (!state.explore.urn) {
    state.explore.urn = {
      R: 3, B: 3, withRep: false, predA: '', predLocked: false, predRevised: false, predRevision: '',
      series: {}, // key `${R}-${B}-${withRep}`
      q: { pSame: '', pDiff: '' }, checkedQ: null
    };
  }
  return state.explore.urn;
}
function urnSeriesKey(u) { return `${u.R}-${u.B}-${u.withRep ? 'W' : 'WO'}`; }
function runUrnSim(times) {
  const u = getExpUrn();
  if (!u.predLocked) return;
  const k = urnSeriesKey(u);
  if (!u.series[k]) u.series[k] = { n: 0, same: 0, diff: 0, last: null };
  const s = u.series[k];
  const tot = u.R + u.B;
  for (let i = 0; i < times; i++) {
    const firstRed = ri(1, tot) <= u.R;
    let secondRed;
    if (u.withRep) {
      secondRed = ri(1, tot) <= u.R;
    } else {
      const remR = firstRed ? u.R - 1 : u.R;
      secondRed = ri(1, tot - 1) <= remR;
    }
    const isSame = firstRed === secondRed;
    s.n += 1;
    if (isSame) s.same += 1; else s.diff += 1;
    s.last = { d1: firstRed ? 'R' : 'B', d2: secondRed ? 'R' : 'B', isSame };
  }
  save(); render();
}

`;
  const section2 = `${novaNote(l === 'es' ? 'Elige una puerta. Cuando el presentador muestre una cabra, decide si mantienes o cambias.' : 'Pick a door. When the host reveals a goat, decide whether to stay or switch.')}        <div class="subpanel">
          <strong>${l === 'es' ? '2. Partida manual paso a paso (3 puertas)' : '2. Interactive Single Game (3 doors)'}</strong>
          <div class="door-grid">
            ${[0, 1, 2].map((d) => {
              const isChosen = g.chosen === d || g.finalChoice === d;

              const isEnd = g.phase === 'done';
              const isPrize = d === g.prize;
              const cls = isEnd && isPrize ? 'win' : isOpened ? 'opened' : isChosen ? 'chosen' : '';
              const icon = isOpened ? '🐐' : isEnd ? (isPrize ? '🏆' : '🐐') : isChosen ? '👉' : '🚪';
              const lbl = isOpened ? (l === 'es' ? 'Cabra (abierta)' : 'Goat (opened)') : isEnd ? (isPrize ? (l === 'es' ? '¡Premio!' : 'Prize!') : (l === 'es' ? 'Cabra' : 'Goat')) : isChosen ? (l === 'es' ? 'Tu elección' : 'Your pick') : (l === 'es' ? `Puerta ${d + 1}` : `Door ${d + 1}`);

function checkExpDiag() {
  const d = getExpDiag();
  const l = L();
  const N = d.popN;
  const sick = (N * d.prevPct) / 100;
  const healthy = N - sick;
  const tp = (sick * d.sensPct) / 100, fn = sick - tp;
  const tn = (healthy * d.specPct) / 100, fp = healthy - tn;
  const ppv = (tp + fp) > 0 ? tp / (tp + fp) : NaN;
  const sensitivity = d.sensPct / 100;
  const expectedComparison = Math.abs(ppv - sensitivity) < 1e-10 ? 'equal' : (ppv > sensitivity ? 'ppv' : 'sens');
  const ok = closeProb(d.table.tp, tp, 0.15) && closeProb(d.table.fn, fn, 0.15) &&
    closeProb(d.table.fp, fp, 0.15) && closeProb(d.table.tn, tn, 0.15) &&
    closeProb(d.pCondGivenPos, ppv, 0.006) && d.comparison === expectedComparison && d.predInit === 'up';
  d.checked = {
    ok,
    msg: ok
      ? (l === 'es' ? `Exacto: P(Condición|+) = ${fmt(ppv, 3)} y Sensibilidad = ${fmt(sensitivity, 3)}; la comparación corresponde a estos datos concretos. Al aumentar el porcentaje de personas con la condición disminuye el peso relativo de los falsos positivos.` : `Verified: P(Condition|+) = ${fmt(ppv, 3)} and Sensitivity = ${fmt(sensitivity, 3)}; their ordering is specific to these data. A higher percentage with the condition reduces the relative weight of false positives.`)
      : (l === 'es' ? 'Revisa los 4 recuentos, calcula TP/(TP+FP), compara ese resultado con la sensibilidad y prueba qué ocurre al aumentar el porcentaje de personas con la condición.' : 'Check the 4 counts, compute TP/(TP+FP), compare it with sensitivity, and test what happens when the percentage with the condition rises.')
  };
  if (ok) advanceSello('selRep', 'autonomous');
  save(); render(); if(ok) focusExploreFinish();
}

function checkExpUrn() {
  const u = getExpUrn();
  const l = L();
  const tot = u.R + u.B;
  const pSameExact = u.withRep
    ? (u.R * u.R + u.B * u.B) / (tot * tot)

function getInvState(id) {
  if (!state.investigations[id]) {
    const meta = INV_META.find((m) => m.id === id) || INV_META[1];
    state.investigations[id] = {
      stage: 1, helpOpen: false, toolsOpen: false, manualReviews: {},
      strategy: '',         // 'table' | 'tree' | 'counting' | 'sim'
      predLocked: false,
      repTool: 'tree',      // 'tree' | 'sim'
      predA: '', predB: '', predRevised: false, predRevision: '',
      workbenchN: meta.id === 'inv3' ? 6 : 4,
      treeDraft: { p1Num: '', p1Den: '', p2SameNum: '', p2SameDen: '', treeOk: false },
      simSeries: {},        // keyed by N -> { n, hits, last }
      cases: [],            // [{ N, pairsDesc, userP, validN, checked, ok }]
      newCaseInput: String(meta.id === 'inv3' ? 9 : 6),
      patternText: '',
      ruleExpr: '',
      ruleHistory: [],      // tracks failed conjectures so fixing grants hueCon
      ruleChecked: null,
      verifyN: '',
      verifyByRule: '',
      verifyByCalc: '',
      verifyChecked: null,
      justOrig: '',
      justRevised: '',
      justPartnerB: '',
      rubric: [false, false, false],
      peerReview: { enabled: false, wellBacked: '', missing: '', suggest: '', saved: false },
      helpsUsed: { example: false, hint1: false, hint2: false }
    };
  }
  const inv = state.investigations[id];
  if (!Number.isInteger(inv.stage) || inv.stage < 1 || inv.stage > 5) inv.stage = inv.justSaved ? 5 : inv.ruleChecked?.ok ? 4 : inv.cases?.length ? 2 : inv.predLocked ? 2 : 1;
  if (!inv.manualReviews || typeof inv.manualReviews !== 'object') inv.manualReviews = {};
  if (inv.predLocked === undefined) {
    // Existing notebooks may have predictions and experimental evidence created before the lock.
    inv.predLocked = Object.values(inv.simSeries || {}).some((series) => series.n > 0);
  }
  return inv;
}

function anyInvHelpUsed(inv) {
  return Boolean(inv.helpsUsed && (inv.helpsUsed.hint1 || inv.helpsUsed.hint2));
}

function runInvSim(invId, N, times) {
  const meta = INV_META.find((m) => m.id === invId);
  const inv = getInvState(invId);
  if (!inv.predLocked || !meta.validN(N) || N > meta.maxN) return; // Never simulate an invalid bag.
  const key = String(N);
  if (!inv.simSeries[key]) inv.simSeries[key] = { n: 0, hits: 0, last: null };
  const s = inv.simSeries[key];
  const groupSize = invId === 'inv3' ? N / 3 : N / 2;
  const numColors = invId === 'inv3' ? 3 : 2;

  for (let i = 0; i < times; i++) {
    const c1 = Math.floor(Math.random() * numColors); // uniform across balanced colors
    const remSame = groupSize - 1;
    const isSame2 = ri(1, N - 1) <= remSame;
    const c2 = isSame2 ? c1 : (c1 + ri(1, numColors - 1)) % numColors;
    const hit = invId === 'inv1' ? (c1 !== c2) : (c1 === c2);
    s.n += 1;
    if (hit) s.hits += 1;
    s.last = { c1, c2, hit };
  }
  save(); render();
}

      ${stage===2?(curMeta.id==='inv1'?`<div class="two-zone">${workbench()}<div>${stages[1]()}</div></div>`:`${stages[1]()}<details class="inv-support" data-inv-details="toolsOpen" ${inv.toolsOpen?'open':''}><summary>${bi('Árbol o simulador (opcional)','Tree or simulator (optional)')}</summary>${workbench()}</details>`):`${stage===3?casesSummary:''}${stages[stage-1]()}`}
      ${stage===4?`<details class="inv-support" data-inv-details="toolsOpen" ${inv.toolsOpen?'open':''}><summary>🧰 ${l==='es'?'Abrir árbol o simulador':'Open tree or simulator'}</summary>${workbench()}</details>`:''}
      ${[2,3,4,5].includes(stage)?help():''}
      <div class="inv-stage-footer">
        ${stage>1?`<button type="button" class="btn-ghost" data-inv-stage="${stage-1}">← ${l==='es'?'Anterior':'Back'}</button>`:'<span></span>'}
        ${stage<5?`<button type="button" class="btn-primary" data-inv-stage="${stage+1}">${l==='es'?'Siguiente':'Next'}: ${labels[stage]} →</button>`:''}${pauseButton()}
      </div>
      ${stage===5?researchClosure(curMeta.id,inv):''}
    </section>`}`;
}

function reviewText(inv, kind) {
  return kind === 'pattern' ? (inv.patternText || '').trim() : (inv.justRevised || '').trim() || (inv.justOrig || '').trim();
}
function renderManualReview(id, kind) {
  const inv = getInvState(id), l=L(), review=inv.manualReviews[kind];

  ${review?`<span class="status-txt st-cons">✓ ${l==='es'?'Validación registrada':'Review recorded'} · ${escapeText(review.date)}</span>`:`<button type="button" class="btn-teal" data-inv-approve="${id}:${kind}">✓ ${l==='es'?(kind==='pattern'?'Validar patrón':'Validar justificación'):(kind==='pattern'?'Approve pattern':'Approve justification')}</button>`}
  ${review && state.publicId?`<button type="button" class="btn-ghost" data-pkm-code="${seal}:sello">${escapeText(tr('codeBtn'))}</button>`:''}</div><div class="meta-line" data-review-message="${kind}" role="status"></div></div>`;
}
function approveInvWriting(id, kind) {
  const inv=getInvState(id), l=L();
  if (!['pattern','justification'].includes(kind)) return;
  if (reviewText(inv, kind).length < LENGTHY_JUSTIFICATION) {

/* ================= CHECKERS FOR INVESTIGA ================= */
function checkInvTree(id) {
  const l = L();
  const meta = INV_META.find((m) => m.id === id);
  const inv = getInvState(id);
  const N = Number(inv.workbenchN);
  const td = inv.treeDraft;
  const p1n = parseProb(td.p1Num), p1d = parseProb(td.p1Den);
  const p2n = parseProb(td.p2SameNum), p2d = parseProb(td.p2SameDen);
  const expFirst = id === 'inv3' ? N / 3 : N / 2;
  const expSecond = id === 'inv1' ? N / 2 : (id === 'inv3' ? N / 3 - 1 : N / 2 - 1);
  const wasWrong = td.hadError;

  const ok = meta.validN(N) && Math.abs(p1n - expFirst) < 1e-6 && Math.abs(p1d - N) < 1e-6 &&
    Math.abs(p2n - expSecond) < 1e-6 && Math.abs(p2d - (N - 1)) < 1e-6;
  td.treeOk = ok;
  if(!ok && [td.p1Num,td.p1Den,td.p2SameNum,td.p2SameDen].every(v=>String(v).trim())) td.hadError=true;
  td.msg = ok
    ? (l === 'es' ? `Ramas coherentes para N = ${N}: 1.ª extracción sobre ${N} y 2.ª sobre ${N - 1}.` : `Consistent branches for N = ${N}: 1st draw out of ${N}, 2nd out of ${N - 1}.`)
    : (l === 'es' ? 'Revisa el número de fichas favorables y el total restante en cada etapa (sin reemplazamiento pasa de N a N − 1).' : 'Check favorable counts and remaining total at each stage (without replacement drops from N to N − 1).');
  if (ok) {
    if (wasWrong) awardHuella('hueTab',id);
    advanceSello('selRep', anyInvHelpUsed(inv) ? 'guided' : 'autonomous');
  }
  save(); render();
}

function researchReady(inv, requireJustification = false) {
  const evidence = Boolean(inv.predLocked && inv.strategy && inv.predA.trim().length >= 12 &&
    inv.cases.filter((c) => c.checked && c.ok).length >= 3 &&
    inv.cases.some(c=>c.ok&&c.N===(inv===state.investigations.inv3?3:2)) &&
    inv.patternText.trim().length >= 25 && inv.ruleChecked?.ok && inv.verifyChecked?.ok);
  return evidence && (!requireJustification || Boolean(inv.justSaved &&
    (inv.justRevised || inv.justOrig || '').trim().length >= LENGTHY_JUSTIFICATION));
}

function refreshResearchRecognition(id) {
  const inv = getInvState(id);
  const help = anyInvHelpUsed(inv);
  if (inv.predLocked && inv.cases.filter((c) => c.checked && c.ok).length >= 3 && inv.cases.some(c=>c.ok&&c.N===(id==='inv3'?3:2))) {
    advanceSello('selOrg', help ? 'guided' : (id === 'inv3' ? 'consolidated' : 'autonomous'));
    if (inv.patternText.trim().length >= 25) advanceSello('selPat', 'pending_human');
  }
  if (researchReady(inv)) {
    advanceSello('selReg', help ? 'guided' : (id === 'inv3' ? 'consolidated' : 'autonomous'));
    advanceSello('selCmp', help ? 'guided' : (id === 'inv3' ? 'consolidated' : 'autonomous'));
  }
  if (id === 'inv3' && researchReady(inv, true) && !help && ['inv1','inv2'].some(k=>state.investigations[k]&&researchReady(state.investigations[k],true))) {
    advanceSello('selTrn', 'consolidated');
    if (['inv1', 'inv2'].some((earlier) => state.investigations[earlier] && anyInvHelpUsed(state.investigations[earlier]))) {
      if (!inv.helpRecoveryAwarded) { inv.helpRecoveryAwarded = true; awardHuella('hueAyu','inv3'); }
    }
  }
}

function checkInvCases(id) {
  const l = L();
  const meta = INV_META.find((m) => m.id === id);
  const inv = getInvState(id);
  const hadBad = inv.cases.some(c=>c.hadError);
  inv.cases.forEach((c) => {
    const exact = meta.exactP(c.N);
    c.checked = true;
    c.ok = meta.validN(c.N) && closeProb(c.userP, exact, 0.006);
    if(!c.ok && String(c.userP).trim()) c.hadError=true;
  });
  const okCount = inv.cases.filter((c) => c.ok).length;
  const help = anyInvHelpUsed(inv);
  if (okCount >= 3 && hadBad && inv.cases.some(c=>c.hadError&&c.ok)) awardHuella('hueTab',id);
  refreshResearchRecognition(id);
  save(); render();
}

function checkInvRule(id) {
  const l = L();
  const meta = INV_META.find((m) => m.id === id);
  const inv = getInvState(id);
  const expr = (inv.ruleExpr || '').trim();
  if (!expr) {
    inv.ruleChecked = { ok: false, msg: l === 'es' ? 'Escribe primero una expresión algebraica en función de N.' : 'Write an algebraic rule in terms of N first.' };
    save(); render(); return;
  }
  const ok = meta.testNs.every((N) => {
    const v = evalRuleN(expr, N);
    return Number.isFinite(v) && Math.abs(v - meta.exactP(N)) < 1e-6;
  });
  if (!ok) {
    inv.ruleHistory.push({ expr, ok: false });
    inv.ruleChecked = { ok: false, expr, msg: l === 'es' ? 'La fórmula propuesta no coincide en todos los casos (prueba N = 2 ó 3 y otros N mayores).' : 'The proposed rule fails on some valid N (check edge cases like N = 2 or 3 and larger N).' };
  } else {
    const previous = inv.ruleHistory.at(-1);
    if (previous && !previous.ok && previous.expr !== expr) awardHuella('hueCon',id);
    inv.ruleHistory.push({ expr, ok: true });
    inv.ruleChecked = { ok: true, expr, msg: l === 'es' ? 'La regla coincide con los casos de prueba automáticos. Todavía no es una demostración general: contrasta un N nuevo y razona por qué debería funcionar siempre.' : 'The rule matches the automated test cases. This does not prove it for every N. Now test it on an unseen N outside your table.' };
    refreshResearchRecognition(id);
  }
  save(); render();
}

function checkInvVerify(id) {
  const l = L();
  const meta = INV_META.find((m) => m.id === id);
  const inv = getInvState(id);
  const vN = Number(inv.verifyN);
  if (!meta.validN(vN)) {
    inv.verifyChecked = { ok: false, msg: l === 'es' ? `Introduce un N válido para esta investigación (múltiplo de ${meta.step}, ≥ ${meta.minN}).` : `Enter a valid N (multiple of ${meta.step}, ≥ ${meta.minN}).` };
    save(); render(); return;
  }
  if (inv.cases.some((c) => Number(c.N) === vN)) {
    inv.verifyChecked = { ok: false, msg: l === 'es' ? `N = ${vN} ya estaba en tu tabla de casos. Elige un valor NUEVO distinto para comprobar.` : `N = ${vN} is already in your case table. Choose a BRAND-NEW N to verify.` };
    save(); render(); return;
  }
  const exact = meta.exactP(vN);
  const currentExpr = (inv.ruleExpr || '').trim();
  const evaluatedRule = evalRuleN(currentExpr, vN);
  const ruleIsCurrent = Boolean(inv.ruleChecked?.ok && inv.ruleChecked.expr === currentExpr);
  const byRule = ruleIsCurrent && Number.isFinite(evaluatedRule) && Math.abs(evaluatedRule - exact) < 1e-6 && closeProb(inv.verifyByRule, evaluatedRule, 0.006);
  const byCalc = closeProb(inv.verifyByCalc, exact, 0.006);
  const ok = byRule && byCalc;
  inv.verifyChecked = {
    ok,
    msg: ok
      ? (l === 'es' ? `Comprobación verificada en N = ${vN}: tu regla y tu cálculo coinciden. Recuerda: comprobar un caso apoya la regla, pero justificar requiere explicar por qué vale para todo N.` : `Unseen case N = ${vN} verified: rule and direct calculation agree. Remember: checking a case is not yet a general justification.`)
      : (l === 'es'
        ? (ruleIsCurrent ? 'Comprueba ambos cálculos para tu nuevo N (por regla y por árbol/conteo).' : 'Primero vuelve a comprobar la fórmula actual; después evalúala en el nuevo N y contrástala con un cálculo independiente.')
        : (ruleIsCurrent ? 'Check both values for your new N (via rule and via tree/counting).' : 'First re-check the current formula; then evaluate it at the new N and compare it with an independent calculation.'))
  };
  if (ok) {
    refreshResearchRecognition(id);
    if (!researchReady(inv)) inv.verifyChecked.msg += l === 'es'
      ? ' Para obtener el sello de investigación todavía necesitas una predicción registrada, tres casos (incluido el menor N válido), un patrón razonado y la regla general.'
      : ' For the research seal you still need a saved prediction, three cases (including the smallest valid N), a described pattern and your general rule.';
  }
  save(); render();
}

function saveInvJustification(id) {
  const inv = getInvState(id);
  const l = L();
  if ((inv.justRevised || inv.justOrig || '').trim().length < LENGTHY_JUSTIFICATION) {
    $('saveNotice').textContent = L() === 'es' ? 'Escribe una justificación propia (mínimo 35 caracteres) antes de guardarla.' : 'Write your own mathematical justification (at least 35 characters) before saving.'; return;
  }
  inv.justSaved = true;
  if (inv.peerReview.enabled && ((inv.peerReview.wellBacked || '').trim() || (inv.peerReview.suggest || '').trim())) {
    inv.peerReview.saved = true;
  }
  // Never promote selJus automatically to autonomous — remains flagged as pending_human!
  if (state.sellos.selJus === 'pending') state.sellos.selJus = 'pending_human';
  refreshResearchRecognition(id);
  save(); render();
}

const TALLER_PROB_TOPICS = [
  { id: 'mix', es: 'Mixto (todas las herramientas)', en: 'Mixed (all tools)' },
  { id: 'cond2x2', es: 'Tabla 2×2 y condicionales inversas', en: '2×2 Tables & inverse conditionals' },
  { id: 'tree', es: 'Árboles con/sin reemplazamiento', en: 'Trees with/without replacement' },
  { id: 'diag', es: 'Frecuencias naturales (Sens./Espec.)', en: 'Natural frequencies (Sens./Spec.)' },
  { id: 'alg', es: 'Álgebra de sucesos y denominador cero', en: 'Event algebra & zero denominator' },
  { id: 'edge', es: 'Casos extremos y límites de una simulación', en: 'Edge cases & limits of simulation' }
];

function generateTallerProb(topicReq = state.taller.topic, isReview = false) {
  let topic = topicReq;
  if (topic === 'mix') topic = pick(['cond2x2', 'tree', 'diag', 'alg', 'edge']);

  if (topic === 'cond2x2') {
    const a = ri(4, 10), b = ri(6, 12), c = ri(5, 11), d = ri(15, 25);
    return {
      topic, kind: 'cond2x2', isReview, a, b, c, d,
      user: { pAgB: '', pBgA: '' }, checked: false, ok: false, counted: false,
      usedHelp: { example: false, hint1: false, solution: false }
    };
  }
  if (topic === 'tree') {
    const r = ri(2, 5), b = ri(2, 5), withRep = Math.random() < 0.45;
    const tot = r + b, d2 = withRep ? tot : tot - 1;
    const exactSame = withRep ? (r * r + b * b) / (tot * tot) : (r * (r - 1) + b * (b - 1)) / (tot * d2);
    return {
      topic, kind: 'tree', isReview, r, b, withRep, exactSame, exactDiff: 1 - exactSame,
      user: { same: '', diff: '' }, checked: false, ok: false, counted: false,
      usedHelp: { example: false, hint1: false, solution: false }
    };
  }
  if (topic === 'diag') {
    const prev = pick([2, 4, 5, 10, 20]), sens = pick([80,90]), spec = pick([80,90]), N = 1000;
    const sick = (N * prev) / 100, healthy = N - sick;
    const tp = (sick * sens) / 100, fp = (healthy * (100 - spec)) / 100;
    const ppv = tp / (tp + fp);
    return {
      topic, kind: 'diag', isReview, N, prev, sens, spec, tp, fp, ppv,
      user: { ppv: '' }, checked: false, ok: false, counted: false,
      usedHelp: { example: false, hint1: false, solution: false }
    };
  }
  if (topic === 'alg') {
    const a=ri(2,5), b=ri(2,5), inter=ri(Math.max(1,a+b-10),Math.min(a,b)); const pA=a/10,pB=b/10,pInter=inter/10;
    return {
      topic, kind: 'alg', isReview, pA, pB, pInter, pUnion: pA + pB - pInter,
      user: { union: '', zeroDen: '' }, checked: false, ok: false, counted: false,
      usedHelp: { example: false, hint1: false, solution: false }
    };
  }
  // edge
  const N = pick([2, 4, 6, 8]);
  return {
    topic: 'edge', kind: 'edge', isReview, N, exact: (N / 2 - 1) / (N - 1),
    user: { ans: '', simProof: '' }, checked: false, ok: false, counted: false,
    usedHelp: { example: false, hint1: false, solution: false }
  };
}

      en: { example: 'Example: P(A|B) divides by column B total, while P(B|A) divides by row A total.', hint1: 'The symbol | means “given that”. Look at the event after it: use only that group for the denominator.', solution: 'Compute P(A|B) = a/(a+c) and P(B|A) = a/(a+b).' }
    },

      en: { example: 'Other numbers: P(A)=0.2, P(B)=0.3, P(A∩B)=0.1 → P(A∪B)=0.4. If P(C)=0, conditioning on C is undefined.', hint1: 'Avoid double counting the intersection and never divide by zero.', solution: 'P(A∪B) = 0.4 + 0.5 − 0.2 = 0.7; zero denominator is undefined.' }
    },

      es: { example: 'Ejemplo de una bolsa: con N = 2 (1 roja y 1 azul sin reposición), P(mismo color) = 0. Si aquí tienes N = 2, compara además el caso N = 4, que da 1/3.', hint1: 'Una simulación estima frecuencias; comprobar muchos ensayos no demuestra una regla para todos los valores de N.', solution: 'Calcula las fichas del mismo color que quedan tras la primera extracción. Una simulación grande no sustituye una justificación para todo N.' },
      en: { example: 'With N = 2 (1 red and 1 blue, without replacement), P(same colour) = 0. If your current exercise is N = 2, contrast it with N = 4, which gives 1/3.', hint1: 'A simulation estimates relative frequency; even many trials do not prove a rule for every N.', solution: 'Count the tokens matching the first colour that remain for the second draw. Simulation is not a general proof.' }
    }

  return (bank[kind] || bank.cond2x2)[l];

function getTallerProbFormula(cur) {
  const kind = cur.kind;
  if (kind === 'cond2x2') return `${mathProb('A', 'B')} = ${mathFrac(mathSymbol('a'), '<mi>a</mi><mo>+</mo><mi>c</mi>')} &nbsp;·&nbsp; ${mathProb('B', 'A')} = ${mathFrac(mathSymbol('a'), '<mi>a</mi><mo>+</mo><mi>b</mi>')}`;
  if (kind === 'tree') {
    const total = cur.r + cur.b, den = cur.withRep ? total : total - 1;
    return `${mathProb('RR')} = ${mathFrac(mathNumber(cur.r),mathNumber(total))} · ${mathFrac(mathNumber(cur.withRep ? cur.r : cur.r - 1),mathNumber(den))} &nbsp;&nbsp;·&nbsp;&nbsp; ${mathProb(L() === 'es' ? 'AA' : 'BB')} = ${mathFrac(mathNumber(cur.b),mathNumber(total))} · ${mathFrac(mathNumber(cur.withRep ? cur.b : cur.b - 1),mathNumber(den))}`;
  }
  if (kind === 'diag') return `${mathProb(L() === 'es' ? 'Condición' : 'Condition', 'Test +')} = ${mathFrac('<mtext>VP</mtext>', '<mtext>VP</mtext><mo>+</mo><mtext>FP</mtext>')}`;
  if (kind === 'alg') return `<math xmlns="http://www.w3.org/1998/Math/MathML" class="math-display"><mrow><mi>P</mi><mo>(</mo><mi>A</mi><mo>∪</mo><mi>B</mi><mo>)</mo><mo>=</mo><mi>P</mi><mo>(</mo><mi>A</mi><mo>)</mo><mo>+</mo><mi>P</mi><mo>(</mo><mi>B</mi><mo>)</mo><mo>−</mo><mi>P</mi><mo>(</mo><mi>A</mi><mo>∩</mo><mi>B</mi><mo>)</mo></mrow></math>`;
  return `${mathProb(L() === 'es' ? 'mismo color' : 'same colour')} = ${mathFrac('<mfrac><mi>N</mi><mn>2</mn></mfrac><mo>−</mo><mn>1</mn>', '<mi>N</mi><mo>−</mo><mn>1</mn>')}`;
}

function checkTallerProb() {
  const cur = state.taller.current;
  if (!cur) return;
  const l = L(), u = cur.user;
  let ok = false;
  if (cur.kind === 'cond2x2') ok = closeProb(u.pAgB, cur.a / (cur.a + cur.c), 0.01) && closeProb(u.pBgA, cur.a / (cur.a + cur.b), 0.01);
  else if (cur.kind === 'tree') ok = closeProb(u.same, cur.exactSame, 0.01) && closeProb(u.diff, cur.exactDiff, 0.01);
  else if (cur.kind === 'diag') ok = closeProb(u.ppv, cur.ppv, 0.015);
  else if (cur.kind === 'alg') ok = closeProb(u.union, cur.pUnion, 0.01) && u.zeroDen === 'undef';
  else ok = closeProb(u.ans, cur.exact, 0.006) && u.simProof === 'no';

  cur.checked = true;
  cur.ok = ok;
  if(!ok)cur.wrongAttempts=(cur.wrongAttempts||0)+1;
  cur.msg = ok
    ? (l === 'es' ? '✓ Correcto.' : '✓ Correct.')
    : workshopFeedback(cur);
  if (ok && !cur.counted) {
    cur.counted = true;
    const supported=Object.values(cur.usedHelp||{}).some(Boolean), labId=({cond2x2:'cond',tree:'tree',diag:'diag',alg:'alg',edge:'edge'})[cur.kind];
    if(!supported){const entry=state.mastery[labId] ||= {cases:[],applied:false}; const sig=exerciseSignature(cur);if(!entry.cases.includes(sig))entry.cases.push(sig);}
    state.taller.solved += 1;
    if (Object.values(cur.usedHelp || {}).some(Boolean)) state.taller.withHelp = (state.taller.withHelp || 0) + 1;
    else state.taller.autonomous = (state.taller.autonomous || 0) + 1;
    if (cur.isReview && !Object.values(cur.usedHelp || {}).some(Boolean)) {
      if (cur.reviewFromHelp && cur.reviewOrigin && cur.reviewOrigin!==exerciseSignature(cur)) awardHuella('hueAyu','taller:'+cur.topic);
    }
  } else if (!ok && !cur.queuedErr) {
    cur.queuedErr = true;
    if (state.taller.errorQueue.length < 15) state.taller.errorQueue.push({ topic: cur.topic, fromError: true, fromHelp: Object.values(cur.usedHelp || {}).some(Boolean), signature:exerciseSignature(cur) });
  }
  save(); render();
}

    g.won = final === g.prize;
    g.phase = 'done';
    const manualSeries = montySeries(m, 3);

  if (t.dataset.urnSim) { runUrnSim(Number(t.dataset.urnSim)); return; }

  else if (el.dataset.expmontyQ) { const m = getExpMonty(); m.q[el.dataset.expmontyQ] = el.value; m.checkedQ = null; save(); }
  else if (el.dataset.diagTab) { editExploreTableCell('diag',el,el.dataset.diagTab); }

  else if (el.dataset.diagQ) { const d = getExpDiag(); d[el.dataset.diagQ] = el.value; d.checked = null; save(); }
  else if (el.dataset.urnPred) { getExpUrn().predA = el.value; save(); }
  else if (el.dataset.urnRevision) { getExpUrn().predRevision = el.value; save(); }
  else if (el.dataset.urnQ) { const u = getExpUrn(); u.q[el.dataset.urnQ] = el.value; u.checkedQ = null; save(); }
  else if (el.dataset.invTree) { recordInvestigationActivity(state.activeInv); const inv = getInvState(state.activeInv); inv.treeDraft[el.dataset.invTree] = el.value; inv.treeDraft.treeOk = false; inv.treeDraft.msg = ''; save(); }

      inv.ruleChecked = null;
      inv.verifyChecked = null;
    } else if (['verifyN', 'verifyByRule', 'verifyByCalc'].includes(el.dataset.invField)) {
      inv.verifyChecked = null;

    save();
  }
  else if (el.dataset.invCasep != null) { recordInvestigationActivity(state.activeInv); const c = getInvState(state.activeInv).cases[Number(el.dataset.invCasep)]; c.userP = el.value; c.checked = false; c.ok = false; clearCellFeedback(el); const status=app.querySelector(`[data-inv-case-status="${el.dataset.invCasep}"]`); if(status)status.textContent="—"; save(); }
  else if (el.dataset.invPeerToggle) { recordInvestigationActivity(state.activeInv); getInvState(state.activeInv).peerReview.enabled = el.checked; save(); render(); }
  else if (el.dataset.invPeer) { recordInvestigationActivity(state.activeInv); getInvState(state.activeInv).peerReview[el.dataset.invPeer] = el.value; save(); }

  else if (el.dataset.talTopic) {
    switchWorkshopTopic(el.value);
    save(); render();
  }

$('modal').addEventListener('click', (event) => {
  const e = {target:event.target.closest('button') || event.target};
  if (e.target.dataset.printReport) { document.body.classList.add('printing-notebook'); window.print(); return; }
  if (e.target === $('modal') || e.target.dataset.closeDlg) { closeDialog(); return; }
  if (e.target.id === 'savePkmBtn') {
    state.publicId = ($('pkmIdInp').value || '').trim().slice(0, 128);
    save(); render();
    openPkmDialog(state.publicId ? tr('pkmSaved') : tr('pkmCleared'));
    return;
  }
  if (e.target.id === 'clearPkmBtn') {
    state.publicId = ''; save(); render(); openPkmDialog(tr('pkmCleared')); return;
  }
  if (e.target.dataset.copyPkm !== undefined) {
    const i=e.target.dataset.copyPkm, node=$('codeShow'+i), fb=$('copyFb'+i);
    if (!node || !fb) return;
    const fallback=()=>{try{const selection=window.getSelection(), range=document.createRange();range.selectNodeContents(node);selection.removeAllRanges();selection.addRange(range);}catch{} fb.textContent=tr('copyFail');};
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(node.textContent).then(()=>{fb.textContent=tr('copiedMsg');},fallback);
    } else fallback();
    return;
  }
  if (e.target.id === 'confirmDoReset') {
    state = blankState(true); save(); closeDialog(); render();
  }
});

$('upload').addEventListener('change', (e) => {

    try {
      state = validateSave(JSON.parse(String(reader.result)), { preserveLang: state.lang, preserveId: state.publicId });
      save(); render();
    } catch {
      $('saveNotice').textContent = L() === 'es' ? 'Archivo JSON no válido para Laboratorio de Probabilidad.' : 'Invalid JSON backup for Probability Lab.';
    }
  };
  reader.readAsText(file);
});

 if(id==='tree'){const rep=v.rep==='yes', first=v.first||'', removed=!rep&&first;return `<p>${bi('Bolsa de ejemplo: elige qué pasaría si saliera una ficha de un color concreto (no es una extracción aleatoria).','Example bag: explore what would happen if a particular colour came out (not a random draw).')}</p><div class="row"><button data-lab-visual="tree:rep:no" aria-pressed="${!rep}">${bi('Sin devolver','Without replacement')}</button><button data-lab-visual="tree:rep:yes" aria-pressed="${rep}">${bi('Devolver','With replacement')}</button></div><div class="lab-tokens" role="img" aria-label="${bi('Fichas restantes','Remaining tokens')}">${['r','r','r','b','b'].map((c,i)=>`<span class="lab-token ${c} ${removed===c&&(i===0||i===3)?'removed':''}">${c==='r'?'R':bi('A','B')}</span>`).join('')}</div><div class="row"><button data-lab-visual="tree:first:r">🔴 ${bi('Primera roja','First red')}</button><button data-lab-visual="tree:first:b">🔵 ${bi('Primera azul','First blue')}</button><button class="btn-ghost" data-lab-visual="tree:first:">${bi('Reiniciar','Reset')}</button></div>${first?`<p>${rep?bi('La devolvemos.','We return it.'):bi('La dejamos fuera (ficha tachada).','We leave it outside (crossed-out token).')}</p><div class="formula-card">${mathProb(bi('Segunda roja','Second red'))} = ${mathFrac(mathNumber(3-(removed==='r'?1:0)),mathNumber(removed?4:5))} · ${mathProb(bi('Segunda azul','Second blue'))} = ${mathFrac(mathNumber(2-(removed==='b'?1:0)),mathNumber(removed?4:5))}</div>`:''}`;}
 if(id==='diag'){const n=Number(v.n)||10,tp=n*.9,fn=n*.1,fp=(100-n)*.1,tn=(100-n)*.9;return `<p>${bi('100 personas. El test acierta el 90 % en cada grupo. Cambia cuántas tienen la condición.','100 people. The test is 90% accurate in each group. Change how many have the condition.')}</p><div class="row">${[10,20,40,70].map(n=>`<button data-lab-visual="diag:n:${n}" aria-pressed="${Number(v.n||10)===n}">${n}</button>`).join('')}</div><div class="lab-people" role="img" aria-label="${bi('100 personas clasificadas','100 classified people')}">${Array.from({length:100},(_,i)=>{const k=i<tp?0:i<tp+fn?1:i<tp+fn+fp?2:3;return `<span class="person p${k}">${['+','−','+','−'][k]}</span>`;}).join('')}</div><div class="lab-legend">${[[tp,'VP','TP'],[fn,'FN','FN'],[fp,'FP','FP'],[tn,'VN','TN']].map(([n,es,en],i)=>`<span><b class="person p${i}">${i===0||i===2?'+':'−'}</b> ${n} ${bi(es,en)}</span>`).join('')}</div><p>${bi('VP: verdadero positivo; FN: falso negativo; FP: falso positivo; VN: verdadero negativo.','TP: true positive; FN: false negative; FP: false positive; TN: true negative.')}</p><div class="formula-card">${mathProb(bi('Condición','Condition'),'+')} = ${mathFrac(mathNumber(tp),mathNumber(tp+fp))} ≈ ${fmt(tp/(tp+fp)*100,1)} %</div>`;}
 if(id==='monty'){const n=Number(v.prize)||1,open=[2,3].find(i=>i!==n);return `<p>${bi('Has elegido la puerta 1. Explora cada ubicación posible del premio.','You chose door 1. Explore each possible prize location.')}</p><div class="row">${[1,2,3].map(i=>`<button data-lab-visual="monty:prize:${i}" aria-pressed="${n===i}">🏆 ${i}</button>`).join('')}</div><div class="door-grid">${[1,2,3].map(i=>`<div class="lab-door ${i===open?'opened':''}"><span>${i===n?'🏆':i===open?'🐐':'🚪'}</span><b>${i}</b><small>${i===1?bi('Tu elección','Your choice'):i===open?bi('Abierta','Opened'):bi('Alternativa','Alternative')}</small></div>`).join('')}</div><p>${n===1?bi('Mantener gana; cambiar pierde.','Keeping wins; switching loses.'):bi('Mantener pierde; cambiar gana.','Keeping loses; switching wins.')}</p><p>${bi('Las tres ubicaciones son igual de probables. Conocer la regla del presentador permite comparar estrategias.','The three locations are equally likely. The host rule allows us to compare strategies.')}</p>`;}

 return `<p>${bi('Ejemplo: en una bolsa equilibrada de dos colores con N fichas, la probabilidad de roja en la primera extracción es siempre 1/2. Comprobar N=2, 4 y 6 apoya la idea. Justificarla exige explicar que hay N/2 rojas de N fichas.','Example: in a balanced two-colour bag of N tokens, the chance of red on draw one is always 1/2. Checking N=2, 4 and 6 supports it; justifying it requires explaining that N/2 of N tokens are red.')}</p><div class="formula-card">${mathFrac('<mfrac><mi>N</mi><mn>2</mn></mfrac>','<mi>N</mi>')} = ${mathFrac(mathNumber(1),mathNumber(2))}</div>`;

 const selected=s.cells||[],btn=(n,j)=>`<button class="lab-cell" data-lab-cell="${id}:${j}" aria-pressed="${selected.includes(j)}" ${disabled}>${n}</button>`;

 return `<p class="meta-line">${bi('Selecciona todos los caminos que cumplen la pregunta.','Select every path satisfying the question.')}</p><div class="lab-paths">${['🔴→🔴','🔴→🔵','🔵→🔴','🔵→🔵'].map((x,j)=>btn(x,j)).join('')}</div>`;
}
const LAB_GROUPS={cond:[['known',0,4,'Identificar la condición','Identify the condition'],['notation',5,6,'Leer y escribir P(A | B)','Read and write P(A | B)'],['table',7,9,'Elegir el grupo y detectar errores','Choose the group and spot errors'],['transfer',10,10,'Aplicarlo a otro contexto','Apply it in another context']],tree:[['bag',0,2,'Comprender la segunda extracción','Understand the second draw'],['paths',3,5,'Elegir y combinar caminos','Choose and combine paths'],['transfer',6,6,'Aplicarlo a otra bolsa','Apply it to another bag']],diag:[['classify',0,3,'Distinguir los cuatro resultados','Distinguish the four results'],['counts',4,5,'Contar e interpretar positivos','Count and interpret positives'],['effect',6,6,'Explicar el efecto de los grupos','Explain the effect of group sizes']],monty:[['cases',0,2,'Analizar las tres ubicaciones','Analyse the three locations'],['simulation',3,4,'Interpretar una simulación','Interpret a simulation'],['transfer',5,5,'Cambiar el número de puertas','Change the number of doors']]};
function groupDefs(id){return LAB_GROUPS[id]||[['all',0,labQuestions(id).length-1,labNameSafe(id),labNameSafe(id)]];}
function labNameSafe(id){return labNames[id]?labName(id):bi('Comprueba la idea','Check the idea');}
function groupState(id,key){const root=labState(id);root.groups||={};const g=groupDefs(id).find(x=>x[0]===key)||groupDefs(id)[0];return root.groups[g[0]]||={index:g[1],answered:false,wrong:false,completed:false,rounds:0,misses:0};}
function currentGroup(id,allowed){const defs=groupDefs(id).filter(g=>!allowed||allowed.includes(g[0]));return defs.find(g=>g[0]===labState(id).selectedGroup)||defs.find(g=>!groupState(id,g[0]).rounds)||defs[0];}
function labQuiz(id,allowed=null){const defs=groupDefs(id).filter(g=>!allowed||allowed.includes(g[0])),g=currentGroup(id,allowed),s=groupState(id,g[0]),qs=labQuestions(id),i=s.index,q=qs[i];const header=`<div class="lab-group-tabs">${defs.length>1?defs.map(x=>`<button class="btn-ghost" data-lab-group="${id}:${x[0]}" aria-pressed="${x[0]===g[0]}">${groupState(id,x[0]).rounds?'✓ ':''}${bi(x[3],x[4])}</button>`).join(''):''}</div><div class="row-between"><strong>${bi(g[3],g[4])}</strong><span class="meta-line">${s.completed?g[2]-g[1]+1:i-g[1]+1} / ${g[2]-g[1]+1}</span></div>`;
 if(s.completed){const next=defs.slice(defs.indexOf(g)+1).find(x=>!groupState(id,x[0]).rounds);return `${header}<div class="nova-note">${mascot()}<p><strong>${bi('¡Destreza practicada!','Skill practised!')}</strong> ${bi('Ahora puedes aplicar esta idea al problema o terminar por hoy.','Apply this idea to the problem now, or finish for today.')}</p></div><div class="row">${next?`<button data-lab-group="${id}:${next[0]}">${bi('Siguiente destreza','Next skill')} →</button>`:''}<button class="btn-ghost" data-lab-repeat="${id}">${bi('Volver a practicar','Practise again')}</button>${pauseButton()}</div>`;}
 const special=labSpecial(id,i);return `${header}<progress value="${i-g[1]+(s.answered?1:0)}" max="${g[2]-g[1]+1}"></progress><p><strong>${escapeText(q.q)}</strong></p>${special?specialInputs(id,i,s)+(s.answered?'':`<div class="row"><button data-lab-special-check="${id}">${tr('checkBtn')}</button></div>`):`${id==='cond'&&i===9?labTable():''}<div class="lab-options">${q.opts.map((o,j)=>`<button class="btn-ghost ${s.answered&&j===q.correct?'lab-right':s.wrong&&s.last===j?'lab-wrong':''}" data-lab-answer="${id}:${j}" ${s.answered?'disabled':''}>${escapeText(o)}</button>`).join('')}</div>`}${s.answered?`<div class="callout ok">✓ ${escapeText(q.feedback)}</div><button data-lab-next="${id}">${i===g[2]?bi('Terminar esta destreza','Finish this skill'):bi('Siguiente','Next')} →</button>`:s.wrong?`<div class="nova-note">${mascot()}<p>${escapeText(q.feedback)} ${bi('Inténtalo de nuevo.','Try again.')}</p></div>`:''}`;}
function renderLab(id,mode='both',open=false,allowed=null,worked=''){const root=labState(id),key=allowed?.join(',')||'all';return `<details class="learn-nova lab-box" data-lab-open="${id}:${key}" ${open||root.open?.[key]?'open':''}><summary>${novaSmall()} ${bi('Aprende con Nova (opcional)','Learn with Nova (optional)')}</summary><div><p class="meta-line">${bi('Elige una destreza breve o consulta el ejemplo. No cuenta como pista del ejercicio.','Choose a short skill or view the example. This does not count as an exercise hint.')}</p>${mode!=='train'?`<details class="lab-example" data-lab-example="${id}:${key}" ${root.examples?.[key]?'open':''}><summary>${bi('Ver ejemplo visual','See visual example')}</summary>${worked}<div data-lab-visual-slot="${id}">${labVisual(id)}</div></details>`:''}${mode!=='learn'?`<div class="lab-quiz" data-lab-quiz-slot="${id}" data-lab-allowed="${allowed?.join(',')||''}">${labQuiz(id,allowed)}</div>`:''}</div></details>`;}
function updateLab(id){app.querySelectorAll(`[data-lab-visual-slot="${id}"]`).forEach(el=>el.innerHTML=labVisual(id));app.querySelectorAll(`[data-lab-quiz-slot="${id}"]`).forEach(el=>el.innerHTML=labQuiz(id,el.dataset.labAllowed?.split(',').filter(Boolean).length?el.dataset.labAllowed.split(','):null));save();}
function quizContext(el,id){const allowed=el.closest('[data-lab-quiz-slot]')?.dataset.labAllowed?.split(',').filter(Boolean);const g=currentGroup(id,allowed?.length?allowed:null);return {g,s:groupState(id,g[0])};}

function researchLesson(stage,id){const es=L()==='es';const examples=[['Una predicción razonada','A reasoned prediction','En una bolsa equilibrada, creo que P(primera roja) no cambia al aumentar N, porque la mitad de las fichas siguen siendo rojas.','In a balanced bag I expect P(first red) not to change with N, because half the tokens remain red.'],['Elegir casos útiles','Choose useful cases','Para una bolsa de 4 colores equilibrados, N=4, 8, 12 y 40 permiten estudiar el menor caso, varios próximos y uno mayor. N=5 no es válido.','For a balanced 4-colour bag, N=4, 8, 12 and 40 cover the smallest case, nearby cases and a larger one. N=5 is invalid.'],['Describir y generalizar','Describe and generalise','En una bolsa equilibrada de 4 colores, P(primera roja)=1/4 para N=4, 8 y 12. Una descripción precisa indica que no cambia; la regla N/4 dividido entre N explica cómo se obtiene 1/4.','In a balanced 4-colour bag P(first red)=1/4 for N=4, 8 and 12. A precise description states that it stays constant; the rule N/4 divided by N explains why it is 1/4.'],['Comprobar por otro método','Check using another method','Si una regla predice 1/4 para N=20, cuenta las fichas: hay 5 rojas entre 20. Comparar 5/20 con la predicción es una comprobación independiente. Sustituir dos veces en la regla no lo es.','If a rule predicts 1/4 for N=20, count tokens: 5 red out of 20. Comparing 5/20 with the prediction is an independent check. Substituting twice is not.'],['Justificar una regla','Justify a rule','Para cualquier N múltiplo de 4 hay N/4 fichas rojas. Como todas tienen igual posibilidad de salir primero, dividimos N/4 entre N y obtenemos 1/4. Esto explica todos los N válidos, no solo tres ejemplos.','For every N divisible by 4 there are N/4 red tokens. Each is equally likely on draw one, so dividing N/4 by N gives 1/4. This explains all valid N, not just three examples.']][stage-1];return `<details class="learn-nova" ${id==='inv1'?'open':''}><summary>${novaSmall()} ${bi(examples[0],examples[1])}</summary><div><p>${bi(examples[2],examples[3])}</p>${stage===3||stage===5?`<div class="formula-card">${mathFrac('<mfrac><mi>N</mi><mn>4</mn></mfrac>','<mi>N</mi>')} = ${mathFrac(mathNumber(1),mathNumber(4))}</div>`:''}<div class="lab-quiz" data-lab-quiz-slot="research${stage}">${labQuiz('research'+stage)}</div></div></details>`;}
function guidedPrompt(cur){const p={cond2x2:['Localiza el total de la columna B para la primera pregunta y el total de la fila A para la segunda. ¿Qué celda tienen en común?','Find the B column total for question one and the A row total for question two. Which cell do they share?'],tree:['Dibuja las cuatro rutas posibles. Para cada una, multiplica las ramas. Separa las que tienen el mismo color de las de colores distintos.','Draw four paths. Multiply branches along each. Separate matching colours from different colours.'],diag:['Calcula cuántas personas tienen la condición, cuántas no y cuántos positivos hay en cada grupo. Usa esos dos últimos recuentos.','Find how many have the condition, how many do not, and positives in each group. Use those last two counts.'],alg:['Suma las probabilidades de ambos grupos; resta una vez la parte común. Para la segunda pregunta, piensa cuántos casos contiene C.','Add both probabilities; subtract the overlap once. For the second question, consider how many cases are in C.'],edge:['Tras la primera extracción, cuenta cuántas fichas del mismo color quedan y cuántas en total.','After the first draw, count remaining matching tokens and total tokens.']}[cur.kind];return bi(...p);}
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;

 if(d.labSpecialCheck||d.labAnswer){const [id,j]=(d.labSpecialCheck||d.labAnswer).split(':'),{s}=quizContext(t,id),q=labQuestions(id)[s.index];if(s.answered||s.completed||!q)return;const correct=d.labSpecialCheck?specialAnswerCorrect(id,s.index,s):Number(j)===q.correct;s.last=Number(j);s.answered=correct;s.wrong=!correct;if(!correct)s.misses++;updateLab(id);}
 if(d.labNext){const id=d.labNext,{g,s}=quizContext(t,id);if(!s.answered||s.completed)return;if(s.index===g[2]){s.completed=true;s.rounds++;const root=labState(id);root.selectedGroup=g[0];if(groupDefs(id).every(x=>groupState(id,x[0]).rounds))root.rounds=1;}else{s.index++;s.answered=false;s.wrong=false;s.last=-1;s.cells=[];s.first='';s.second='';}updateLab(id);}
 if(d.labRepeat){const id=d.labRepeat,{g,s}=quizContext(t,id);Object.assign(s,{index:g[1],answered:false,wrong:false,completed:false,last:-1,cells:[],first:'',second:''});updateLab(id);}
 if(d.labGuide){const c=state.taller.current;c.usedHelp.hint1=true;c.guideOpened=true;c.helpOpen=true;const queued=state.taller.errorQueue.find(x=>x.signature===exerciseSignature(c));if(queued)queued.fromHelp=true;if(!c.queuedErr){c.queuedErr=true;if(state.taller.errorQueue.length<15)state.taller.errorQueue.push({topic:c.topic,fromError:false,fromHelp:true,signature:exerciseSignature(c)});}save();render();}
});

function exerciseSignature(c){return c.kind+':'+({cond2x2:[c.a,c.b,c.c,c.d],tree:[c.r,c.b,c.withRep],diag:[c.prev,c.sens,c.spec],alg:[c.pA,c.pB,c.pInter],edge:[c.N]})[c.kind].join(',');}

function coachSteps(c){const total=c.r+c.b,den=c.withRep?total:total-1;return ({cond2x2:[['Total de la columna B','Total of column B',c.a+c.c],['Total de la fila A','Total of row A',c.a+c.b],['Casos comunes a A y B','Cases common to A and B',c.a]],tree:[['Fichas disponibles en la segunda extracción','Tokens available on draw two',den],['Probabilidad de roja y luego roja','Chance of red then red',c.r/total*(c.withRep?c.r:c.r-1)/den],['Probabilidad de azul y luego azul','Chance of blue then blue',c.b/total*(c.withRep?c.b:c.b-1)/den]],diag:[['Personas con la condición','People with the condition',c.N*c.prev/100],['Verdaderos positivos','True positives',c.tp],['Falsos positivos','False positives',c.fp],['Total de positivos','Total positives',c.tp+c.fp]],alg:[['Probabilidad de A más probabilidad de B','Probability of A plus probability of B',c.pA+c.pB],['Probabilidad de la parte común','Probability of the overlap',c.pInter]],edge:[['Fichas del mismo color que quedan','Remaining tokens of the same colour',c.N/2-1],['Total de fichas que quedan','Total remaining tokens',c.N-1]]})[c.kind];}

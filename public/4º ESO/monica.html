/* Pokemáticos Deterministic Reward Code Encoder (matches src/utils/rewardCodeUtils.js) */
function pkmCrc8(buf){let c=0xFF;for(let i=0;i<buf.length;i++){c^=buf[i];for(let j=0;j<8;j++)c=(c&0x80)?(((c<<1)^0x07)&0xFF):((c<<1)&0xFF)}return c^0xFF}
function pkmCrc32(str){let c=0xFFFFFFFF;for(let i=0;i<str.length;i++){c^=(str.charCodeAt(i)&0xFF);for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xEDB88320:0)}return (c^0xFFFFFFFF)>>>0}
function generateRewardCode(studentId,sourceId,activityId){
 if(!studentId||!sourceId||!activityId)throw new Error('Missing code parameters');
 const payload=[0x01];
 const h=pkmCrc32(studentId);
 payload.push((h>>24)&0xFF,(h>>16)&0xFF,(h>>8)&0xFF,h&0xFF);
 const s=sourceId.substring(0,6).padEnd(6,' '),a=activityId.substring(0,6).padEnd(6,' ');
 for(let i=0;i<6;i++)payload.push(s.charCodeAt(i));
 for(let i=0;i<6;i++)payload.push(a.charCodeAt(i));
 payload.push(pkmCrc8(new Uint8Array(payload)));
 let n=0n;for(const b of payload)n=(n<<8n)|BigInt(b);
 const b36=n.toString(36).toUpperCase().padStart(28,'0');
 return `${b36.slice(0,4)}-${b36.slice(4,8)}-${b36.slice(8,12)}-${b36.slice(12,16)}-${b36.slice(16,20)}-${b36.slice(20,24)}-${b36.slice(24,28)}`;
}

  const rename=x=>{if(typeof x==='string')return x.replace(/manti[s]a(s?)/gi,(word,plural)=>(word[0]===word[0].toUpperCase()?'Coeficiente':'coeficiente')+plural).replace(/(la|las|una) ((?:primera|segunda) )?coeficiente(s?)/gi,(all,article,order,plural)=>{let a={la:'el',las:'los',una:'un'}[article.toLowerCase()];if(article[0]===article[0].toUpperCase())a=a[0].toUpperCase()+a.slice(1);return a+' '+(order?(order.trim()==='primera'?'primer ':'segundo '):'')+'coeficiente'+plural});if(Array.isArray(x))return x.map(rename);if(object(x)){for(const k of Object.keys(x))x[k]=rename(x[k])}return x};
  data=rename(data);data.practiceDone={};for(const k of Object.keys(data.done))data.practiceDone[k]=true;

 }
 requireValid(object(data.practiceDone));for(const [k,v] of Object.entries(data.practiceDone))requireValid(/^[0-6]$/.test(k)&&v===true);

 else data.publicId=(opts.preserveId||'').trim();
 if(data.anyStreak!==undefined)requireValid(integer(data.anyStreak));else data.anyStreak=data.streak;
 if(data.bestAnyStreak!==undefined)requireValid(integer(data.bestAnyStreak));else data.bestAnyStreak=Math.max(data.anyStreak,data.best);

 const lgs=emptyLogros();

 if(data.bestAnyStreak>=10)lgs.logro1=true;
 if(data.bestNoHintStreak>=20)lgs.logro2=true;
 if(lgs.logro1&&lgs.logro2&&lgs.logro3&&lgs.logro4&&Object.keys(data.done).length===7)lgs.logro5=true;

function getTheory(i){
 if(L()==='en')return [
  `<p>Scientific notation writes very large or very small numbers concisely: <strong>coefficient × power of ten</strong>.</p><div class="parts" role="group" aria-label="Parts of 3.25 times 10 to the 6"><div class="part coefficient"><strong>3.25</strong><span>Coefficient</span></div><strong>·</strong><div class="part"><strong>10</strong><span>Base</span></div><div class="part exponent"><strong>6</strong><span>Exponent</span></div></div><p>In this expression, the coefficient is 3.25, the base is 10, and the exponent is 6. Purple highlights the coefficient and green highlights the exponent.</p><div class="formula"><span class="coefficient">a</span> · 10<sup class="exponent">n</sup></div><p>For positive numbers, 1 ≤ a &lt; 10 and n is an integer. The exponent shows the order of magnitude. There is only one non-zero digit before the decimal point in the coefficient.</p><div class="example">230,000 = ${p(2.3,5)}<br>Move the decimal point five places to the left.<br>0.00042 = ${p(4.2,-4)}<br>Move the decimal point four places to the right.</div><p>To go back to decimal form, multiply by the power of ten. A negative exponent means dividing by a power of ten.</p>`,
  `<p>The same number can be written in many ways. Notice: 2 × 100 = 20 × 10 = 200 × 1.</p><div class="formula">${p(2,2)} = ${p(20,1)} = ${p(200,0)}</div><div class="tip"><strong>Compensation rule:</strong> if the exponent increases, divide the coefficient by 10 for each unit. If it decreases, multiply by 10 for each unit.</div><div class="example">${p(2.5,2)} = ${p(25,1)} = ${p(.25,3)}. All three expressions equal 250, though only the first is normalized.</div><div id="sim"></div><div class="example"><strong>Your transformation route</strong><p>1. Predict whether the coefficient grows or shrinks.<br>2. Count the units between exponents.<br>3. Move the decimal point that many places.<br>4. Check that the value stays the same.</p><p>From −2 to 1 there are three units: −2 → −1 → 0 → 1. The coefficient is divided by 1000.</p></div>`,
  `<p>To add or subtract, we first need the same power of ten. We won't compute the total yet: we will just match exponents.</p><div class="example">${p(2.5,4)} and ${p(3.2,3)}<br>To the larger: ${p(2.5,4)} and ${p(.32,4)}.<br>To the smaller: ${p(25,3)} and ${p(3.2,3)}.</div><p>Both methods are valid. Watch which term changes and which direction the decimal point moves.</p><div id="equalSim"></div>`,
  `<p>With matching exponents, add or subtract the coefficients and keep the power of ten. If they differ, match them first. Normalize at the end if needed.</p><div class="example">${p(2,3)} + ${p(3,3)} = ${p(5,3)}<br>${p(8,-12)} − ${p(5,-12)} = ${p(3,-12)}</div><div class="example"><strong>Two paths, same result</strong><div class="formula">${p(4.56,24)} − ${p(5.24,23)}</div>To the larger: ${p(4.56,24)} − ${p(.524,24)} = ${p(4.036,24)}.<br>To the smaller: ${p(45.6,23)} − ${p(5.24,23)} = ${p(40.36,23)} = ${p(4.036,24)}.</div><div class="tip">Never add or subtract exponents when adding or subtracting numbers.</div>`,
  `<p>In multiplication, multiply the coefficients and add the exponents. In division, divide the coefficients and subtract the exponents (numerator minus denominator).</p><div class="example">(${p(6,6)})(${p(4,4)}) = ${p(24,10)} = ${p(2.4,11)}<br><div class="formula">${frac(p(6,9),p(2,5))} = ${p(3,4)}</div><div class="formula">${frac(p(4,5),p(8,8))} = ${p(.5,-3)} = ${p(5,-4)}</div></div><p>If the coefficient ends up outside [1, 10), adjust the power again to normalize.</p>`,
  `<p>Negative exponents follow the exact same rules. Remember that −2 is greater than −5. Subtracting a negative exponent means adding its opposite.</p><div class="example">${p(4.3,-3)} − ${p(2.5,-4)} = ${p(4.3,-3)} − ${p(.25,-3)} = ${p(4.05,-3)}<br>(${p(2.5,-3)})(${p(4,-2)}) = ${p(10,-5)} = ${p(1,-4)}<br><div class="formula">${frac(p(6,-3),p(2,-5))} = 3 · 10<sup>−3−(−5)</sup> = ${p(3,2)}</div></div><div class="example"><strong>Exponents with opposite signs</strong><br>(${p(3,2)})(${p(2,-4)}) = ${p(6,-2)}<br>Multiplying: 2 + (−4) = −2. Dividing ${p(6,-3)} by ${p(2,2)}, the exponent is −3 − 2 = −5.</div><p>Normalization works identically: ${p(.48,-3)} = ${p(4.8,-4)}.</p>`,
  `<p>On many calculators, <span class="kbd">EXP</span>, <span class="kbd">EE</span>, or <span class="kbd">×10ˣ</span> enters the power of ten. Do not type another ×10 before EXP.</p><div class="example">7.3 · 10<sup>9</sup>: <span class="kbd">7.3</span> <span class="kbd">EXP</span> <span class="kbd">9</span><br>8.64 · 10<sup>−3</sup>: <span class="kbd">8.64</span> <span class="kbd">EXP</span> <span class="kbd">−3</span> (use your model's negative sign key).<br>A display showing 9.46E−3 represents 0.00946.</div><p>In combined operations: parentheses first, then powers, products and quotients, and finally additions and subtractions. Normalize your final answer.</p><div class="example">(${p(5.1,4)} + ${p(7.2,3)})² = (${p(5.82,4)})² = ${p(33.8724,8)} = ${p(3.38724,9)}</div>`
 ][i];
 return [
  `<p>La notación científica permite escribir números muy grandes o muy pequeños de forma abreviada: <strong>coeficiente × potencia de diez</strong>.</p><div class="parts" role="group" aria-label="Partes de 3,25 por 10 elevado a 6"><div class="part coefficient"><strong>3,25</strong><span>Coeficiente</span></div><strong>·</strong><div class="part"><strong>10</strong><span>Base</span></div><div class="part exponent"><strong>6</strong><span>Exponente</span></div></div><p>En esta expresión, el coeficiente es 3,25, la base es 10 y el exponente es 6. El violeta identifica el coeficiente y el verde, el exponente.</p><div class="formula"><span class="coefficient">a</span> · 10<sup class="exponent">n</sup></div><p>Para números positivos, 1 ≤ a &lt; 10 y n es un entero. En tus apuntes, el exponente identifica el orden de magnitud. Solo hay una cifra entera distinta de cero en el coeficiente.</p><div class="example">230 000 = ${p(2.3,5)}<br>Movemos la coma cinco lugares hacia la izquierda.<br>0,00042 = ${p(4.2,-4)}<br>Movemos la coma cuatro lugares hacia la derecha.</div><p>Para volver a decimal, multiplica por la potencia de diez. Un exponente negativo significa dividir entre una potencia de diez.</p>`,
  `<p>Un mismo número puede expresarse de muchas maneras. Observa: 2 × 100 = 20 × 10 = 200 × 1.</p><div class="formula">${p(2,2)} = ${p(20,1)} = ${p(200,0)}</div><div class="tip"><strong>Regla de compensación:</strong> si el exponente sube, el coeficiente se divide entre 10 por cada unidad. Si baja, se multiplica por 10 por cada unidad.</div><div class="example">${p(2.5,2)} = ${p(25,1)} = ${p(.25,3)}. Las tres expresiones valen 250, aunque solo la primera está normalizada.</div><div id="sim"></div><div class="example"><strong>Tu ruta de transformación</strong><p>1. Anticipa si el coeficiente aumenta o disminuye.<br>2. Cuenta las unidades entre exponentes.<br>3. Mueve la coma ese número de posiciones.<br>4. Comprueba que conservas el valor.</p><p>De −2 a 1 hay tres unidades: −2 → −1 → 0 → 1. El coeficiente se divide entre 1000.</p></div>`,
  `<p>Para sumar o restar, primero necesitamos la misma potencia de diez. Todavía no vamos a operar: solo igualaremos los exponentes.</p><div class="example">${p(2.5,4)} y ${p(3.2,3)}<br>Al mayor: ${p(2.5,4)} y ${p(.32,4)}.<br>Al menor: ${p(25,3)} y ${p(3.2,3)}.</div><p>Los dos métodos son válidos. Fíjate en qué término cambia y en qué dirección se mueve la coma.</p><div id="equalSim"></div>`,
  `<p>Con exponentes iguales, suma o resta los coeficientes y conserva la potencia. Si son diferentes, iguala primero. Normaliza al final si es necesario.</p><div class="example">${p(2,3)} + ${p(3,3)} = ${p(5,3)}<br>${p(8,-12)} − ${p(5,-12)} = ${p(3,-12)}</div><div class="example"><strong>Dos caminos, mismo resultado</strong><div class="formula">${p(4.56,24)} − ${p(5.24,23)}</div>Al mayor: ${p(4.56,24)} − ${p(.524,24)} = ${p(4.036,24)}.<br>Al menor: ${p(45.6,23)} − ${p(5.24,23)} = ${p(40.36,23)} = ${p(4.036,24)}.</div><div class="tip">Nunca sumes ni restes los exponentes al sumar o restar números.</div>`,
  `<p>En la multiplicación, multiplica los coeficientes y suma los exponentes. En la división, divide los coeficientes y resta los exponentes (numerador menos denominador).</p><div class="example">(${p(6,6)})(${p(4,4)}) = ${p(24,10)} = ${p(2.4,11)}<br><div class="formula">${frac(p(6,9),p(2,5))} = ${p(3,4)}</div><div class="formula">${frac(p(4,5),p(8,8))} = ${p(.5,-3)} = ${p(5,-4)}</div></div><p>Si el coeficiente queda fuera del intervalo [1, 10), vuelve a ajustar la potencia.</p>`,
  `<p>Los exponentes negativos siguen las mismas reglas. Recuerda que −2 es mayor que −5. Al restar un exponente negativo, se suma su opuesto.</p><div class="example">${p(4.3,-3)} − ${p(2.5,-4)} = ${p(4.3,-3)} − ${p(.25,-3)} = ${p(4.05,-3)}<br>(${p(2.5,-3)})(${p(4,-2)}) = ${p(10,-5)} = ${p(1,-4)}<br><div class="formula">${frac(p(6,-3),p(2,-5))} = 3 · 10<sup>−3−(−5)</sup> = ${p(3,2)}</div></div><div class="example"><strong>Exponentes de distinto signo</strong><br>(${p(3,2)})(${p(2,-4)}) = ${p(6,-2)}<br>Al multiplicar: 2 + (−4) = −2. Al dividir ${p(6,-3)} entre ${p(2,2)}, el exponente es −3 − 2 = −5.</div><p>La normalización funciona igual: ${p(.48,-3)} = ${p(4.8,-4)}.</p>`,
  `<p>En muchas calculadoras, <span class="kbd">EXP</span>, <span class="kbd">EE</span> o <span class="kbd">×10ˣ</span> introduce la potencia de diez. No escribas otro ×10 antes de EXP.</p><div class="example">7,3 · 10<sup>9</sup>: <span class="kbd">7,3</span> <span class="kbd">EXP</span> <span class="kbd">9</span><br>8,64 · 10<sup>−3</sup>: <span class="kbd">8,64</span> <span class="kbd">EXP</span> <span class="kbd">−3</span> (usa la tecla de signo negativo según tu modelo).<br>Una pantalla que muestra 9,46E−3 representa 0,00946.</div><p>En operaciones combinadas: primero paréntesis, después potencias, productos y cocientes, y finalmente sumas y restas. Normaliza el resultado.</p><div class="example">(${p(5.1,4)} + ${p(7.2,3)})² = (${p(5.82,4)})² = ${p(33.8724,8)} = ${p(3.38724,9)}</div>`
 ][i];

// Exercise objects are serializable data and localize cleanly via L().
function scalar(prompt,expected,h1,h2,solution,extra={}){return {prompt,expected:[expected],labels:[tr('answerLabel')],h1,h2,solution,...extra}}
function scientific(prompt,x,h1,h2,solution,extra={}){return {prompt,expected:norm(x),labels:[tr('coeffLabel'),tr('expLabel')],scientific:true,h1,h2,solution,...extra}}
function convert(a,n,t){
 let b=clean(a*10**(n-t)),d=t-n;
 if(L()==='en')return scalar(`Fill in the coefficient:<div class="formula">${p(a,n)} = ? · 10<sup>${t}</sup></div>`,b,`The exponent ${d>0?'increases':'decreases'}. Should the coefficient grow or shrink to compensate?`,`Shift ${Math.abs(d)} place${Math.abs(d)===1?'':'s'}: ${d>0?'divide':'multiply'} ${fmt(a)} by ${fmt(10**Math.abs(d))}.`,`${p(a,n)} = ${p(b,t)}`,{reverse:clean(a*10**(t-n)),source:{kind:'convert',args:[a,n,t]}});
 return scalar(`Completa el coeficiente:<div class="formula">${p(a,n)} = ? · 10<sup>${t}</sup></div>`,b,`El exponente ${d>0?'aumenta':'disminuye'}. ¿El coeficiente debe aumentar o disminuir para compensar?`,`Cambia ${Math.abs(d)} lugares: ${d>0?'divide':'multiplica'} ${fmt(a)} ${d>0?'entre':'por'} ${fmt(10**Math.abs(d))}.`,`${p(a,n)} = ${p(b,t)}`,{reverse:clean(a*10**(t-n)),source:{kind:'convert',args:[a,n,t]}});
}
function equal(a,n,b,m,t){
 let first=n!==t,q=convert(first?a:b,first?n:m,t);
 if(L()==='en')q.prompt=`Match to exponent ${t} (${t===Math.max(n,m)?'larger':'smaller'}).<div class="formula">${p(a,n)} and ${p(b,m)}</div>${q.prompt}`;
 else q.prompt=`Iguala al exponente ${t} (${t===Math.max(n,m)?'mayor':'menor'}).<div class="formula">${p(a,n)} y ${p(b,m)}</div>${q.prompt}`;
 q.source={kind:'equal',args:[a,n,b,m,t]};return q;
}
function op(a,n,b,m,sign,guided=false,t=Math.max(n,m)){
 const add=sign==='+'||sign==='−',x=val(a,n),y=val(b,m),z=clean(sign==='+'?x+y:sign==='−'?x-y:sign==='×'?x*y:x/y),A=clean(a*10**(n-t)),B=clean(b*10**(m-t)),raw=clean(add?(sign==='+'?A+B:A-B):sign==='×'?a*b:a/b),power=add?t:sign==='×'?n+m:n-m;
 let expr=sign==='÷'?frac(p(a,n),p(b,m)):`${sign==='×'?'('+p(a,n)+')':p(a,n)} ${sign} ${sign==='×'?'('+p(b,m)+')':p(b,m)}`;
 const en=L()==='en';
 let h1=en
  ?(add?'First match the exponents; then operate only on the coefficients.':sign==='×'?'Multiply the coefficients and add the exponents.':'Divide the coefficients and subtract the denominator exponent from the numerator exponent.')
  :(add?'Iguala primero los exponentes; después opera solo los coeficientes.':sign==='×'?'Multiplica los coeficientes y suma los exponentes.':'Divide los coeficientes y resta el exponente del denominador al del numerador.');
 let h2=en
  ?(add?`At exponent ${t}: ${p(A,t)} ${sign} ${p(B,t)}. Operate on the coefficients and normalize.`:`Coefficient operation is ${fmt(a)} ${sign} ${fmt(b)}; exponent is ${sign==='×'?`${n}+(${m})`:`${n}−(${m})`}. Normalize if needed.`)
  :(add?`Al exponente ${t}: ${p(A,t)} ${sign} ${p(B,t)}. Opera los coeficientes y normaliza.`:`La operación de coeficientes es ${fmt(a)} ${sign} ${fmt(b)}; el exponente es ${sign==='×'?`${n}+(${m})`:`${n}−(${m})`}. Normaliza si hace falta.`);
 let solution=`${expr} = ${p(raw,power)} = ${sci(z)}`;
 let q=scientific(`${en?'Compute and express the result in scientific notation.':'Calcula y expresa el resultado en notación científica.'}<div class="formula">${expr}</div>`,z,h1,h2,solution);
 q.source={kind:'op',args:[a,n,b,m,sign,false,t]};
 if(guided){
  let steps=[];
  if(add&&n!==m)steps.push(equal(a,n,b,m,t));
  steps.push(scalar(`${en?'Operate on the coefficients:':'Opera los coeficientes:'}<div class="formula">${fmt(add?A:a)} ${sign} ${fmt(add?B:b)} = ?</div>`,raw,en?'Do the indicated operation without changing the power yet.':'Haz la operación indicada, sin tocar todavía la potencia.',`${en?'Compute':'Calcula'} ${fmt(add?A:a)} ${sign} ${fmt(add?B:b)}.`,fmt(raw)));
  if(!add)steps.push(scalar(`${en?'Compute the exponent:':'Calcula el exponente:'}<div class="formula">${n} ${sign==='×'?'+':'−'} (${m}) = ?</div>`,power,h1,h2,`${power}`));
  steps.push(q);
  return {steps,context:expr,source:{kind:'op',args:[a,n,b,m,sign,true,t]}};
 }
 return q;
}
function decimal(a,n){
 if(L()==='en')return scalar(`Write in decimal notation:<div class="formula">${p(a,n)}</div>`,val(a,n),`A ${n>=0?'non-negative':'negative'} exponent means ${n>=0?'multiplying':'dividing'} by a power of ten.`,`Shift the decimal point ${Math.abs(n)} place${Math.abs(n)===1?'':'s'} to the ${n>=0?'right':'left'}.`,`${p(a,n)} = ${fmt(val(a,n))}`,{source:{kind:'decimal',args:[a,n]}});
 return scalar(`Escribe en notación decimal:<div class="formula">${p(a,n)}</div>`,val(a,n),`El exponente ${n>=0?'positivo o cero':'negativo'} indica ${n>=0?'multiplicar':'dividir'} por una potencia de diez.`,`Desplaza la coma ${Math.abs(n)} lugares hacia la ${n>=0?'derecha':'izquierda'}.`,`${p(a,n)} = ${fmt(val(a,n))}`,{source:{kind:'decimal',args:[a,n]}});
}
function normalize(a,n){
 let x=val(a,n),v=n===null?a:x;
 if(L()==='en')return scientific(`Write in scientific notation:<div class="formula">${n===null?fmt(a):p(a,n)}</div>`,v,'The coefficient must have a single non-zero digit before the decimal point.','Move the decimal point until the coefficient is between 1 and 10 and compensate in the exponent.',`${n===null?fmt(a):p(a,n)} = ${sci(v)}`,{source:{kind:'normalize',args:[a,n]}});
 return scientific(`Escribe en notación científica:<div class="formula">${n===null?fmt(a):p(a,n)}</div>`,v,'El coeficiente debe tener una sola cifra entera distinta de cero.','Mueve la coma hasta obtener un coeficiente entre 1 y 10 y compensa con el exponente.',`${n===null?fmt(a):p(a,n)} = ${sci(v)}`,{source:{kind:'normalize',args:[a,n]}});
}
function combo(type,a=5.1,b=7.2){
 const en=L()==='en';

 dialog.innerHTML=`<div class="dialog-head"><h2>${tr('theoryTitle',getLevels()[level][0])}</h2><button id="closeTheory">${tr('backToExercise')}</button></div>${getTheory(level)}`;
 document.body.append(dialog);if(level===1)sim();if(level===2)equalSim();
 dialog.onclose=()=>{dialog.remove();$('backlearn')?.focus()};$('closeTheory').onclick=()=>dialog.close();dialog.showModal();
}
function renderInputs(q,s){
 if(q.type==='choice')return `<fieldset class="choices"><legend>${tr('chooseOne')}</legend>${q.choices.map((label,i)=>`<label><input type="radio" name="choice" value="${i}" ${s.inputs[0]===String(i)?'checked':''} ${s.resolved?'disabled':''}>${escapeText(label)}</label>`).join('')}</fieldset>`;
 if(q.type==='machine')return '<div id="machinePanel"></div>';
 const input=(label,i,cls='')=>`<div class="${cls}"><label for="a${i}">${label}</label><input type="text" inputmode="text" id="a${i}" autocomplete="off" maxlength="100" ${s.resolved?'disabled':''}></div>`;
 return q.scientific?`<div class="answer scientific-answer">${input(tr('coeffLabel'),0,'coefficient-field coefficient')}<div class="power-field"><span class="power-base">· 10</span>${input(tr('expLabel'),1,'exponent-field exponent')}</div></div>`:`<div class="answer">${q.labels.map((l,i)=>input(l,i)).join('')}</div>`;
}
function renderMachine(q){
 const s=session(),[a,n,t]=q.source.args;if(s.machineExp===undefined)s.machineExp=n;const e=s.machineExp;
 $('machinePanel').innerHTML=`<div class="sim machine"><div class="machine-legend"><span class="coefficient">${tr('machineLegendCoeff')}</span><span class="exponent">${tr('machineLegendExp')}</span></div><div class="machine-value"><div class="formula">${p(clean(a*10**(n-e)),e)}</div></div><p>${tr('machineTarget',t,fmt(val(a,n)))}</p><div class="actions"><button type="button" id="commaLeft" ${s.resolved||e>=Math.max(n,t)+4?'disabled':''}>${tr('commaLeft')}</button><button type="button" id="commaRight" ${s.resolved||e<=Math.min(n,t)-4?'disabled':''}>${tr('commaRight')}</button></div><p class="small">${tr('machineHelp')}</p><button type="button" id="newMachine" class="secondary">${tr('newMachineBtn')}</button></div>`;
 const move=d=>{
  s.machineExp+=d;
  if(s.machineExp===t){
   s.resolved=true;s.lastCorrect=true;s.feedback=tr('machineDone')+q.solution;
   if(s.attempts===0){
    state.anyStreak++;state.bestAnyStreak=Math.max(state.bestAnyStreak,state.anyStreak);
    if((s.hints||0)===0&&!s.stepUsedTheory){state.noHintStreak++;state.bestNoHintStreak=Math.max(state.bestNoHintStreak,state.noHintStreak);if(!s.assisted){state.streak++;state.best=Math.max(state.streak,state.best)}}
   }
   syncLogros();
  }
  save();renderLevel();
 };
 $('commaLeft').onclick=()=>move(1);$('commaRight').onclick=()=>move(-1);
 $('newMachine').onclick=()=>{const replacement=machine(clean(a+.1),n,t);if(s.consolidation)s.consolidation=replacement;else s.queue[s.index]=replacement;resetStep(s);s.assisted=false;s.needsConsolidation=false;save();renderLevel()};
}
function renderLevel(){
 view='level';syncChrome();
 const s=session(),l=getLevels()[level],steps=tr('steps');
 app.innerHTML=`<section class="hero">${mascot()}<div><div class="tag">${tr('missionWord')} ${level+1} / 7 · ${l[2]}</div><h2>${l[0]}</h2><p>${l[1]}</p></div></section><div class="steps">${['learn','practice','challenge','complete'].map((x,i)=>`<span class="${s.phase===x?'on':''}">${steps[i]}</span>`).join('')}</div><div id="content"></div>`;
 if(s.phase==='learn'){
  $('content').innerHTML=`<section class="panel"><h2>${tr('trainingWithNova')}</h2>${getTheory(level)}${novaMessage(level===1?tr('trainingNoteM1'):tr('trainingNoteOther'))}<div class="actions"><button id="practice">${tr('startPractice')}</button>${canChallenge()?`<button id="jump" class="secondary">${tr('goChallenge')}</button>`:`<p class="small">${tr('unlockChallengeHint')}</p>`}</div></section>`;
  if(level===1)sim();if(level===2)equalSim();
  $('practice').onclick=()=>start('practice');if($('jump'))$('jump').onclick=()=>start('challenge');
  return;
 }
 if(s.phase==='complete'){
  const passed=s.score>=4,newly=syncLogros();
  const names=newly.map(id=>LOGROS_META.find(m=>m.id===id)).filter(Boolean).map(m=>`${m.icon} ${m[L()].name}`).join(', ');
  $('content').innerHTML=`<section class="panel"><h2>${passed?tr('missionPassedTitle'):tr('missionKeepTitle')}</h2><p>${tr('challengeSummary',s.score,passed,level===6)}</p>${passed?`<div class="stars">${'★'.repeat(state.done[level])}${'☆'.repeat(3-state.done[level])}</div>`:''}${names?`<div class="feedback good">${escapeText(tr('newLogroBanner',names))}</div>`:''}${novaMessage(passed?tr('novaPassed'):tr('novaFailed'))}<div class="actions">${passed&&level<6?`<button id="nextlevel">${tr('nextMission')}</button>`:''}<button id="retry">${tr('newChallenge')}</button><button class="secondary" id="extra">${tr('randomPractice')}</button><button class="secondary" id="review">${tr('reviewTheory')}</button><button class="secondary" id="fixedPractice">${tr('repeatPractice')}</button></div></section>`;
  if($('nextlevel'))$('nextlevel').onclick=()=>go(level+1);$('retry').onclick=()=>start('challenge');$('extra').onclick=()=>start('extra');$('review').onclick=showTheory;$('fixedPractice').onclick=()=>start('practice');
  return;
 }
 if(!s.consolidation&&s.index>=s.queue.length){finish();return}
 const item=currentItem(),q=currentQuestion();
 const title=s.consolidation?tr('consolidationTag'):s.phase==='challenge'?tr('challengeTag'):s.phase==='extra'?tr('extraTag'):tr('practiceTag');
 const enc=tr('encouragement');
 $('content').innerHTML=`<section class="panel"><div class="tag">${title}${s.consolidation?'':tr('exerciseOf',s.index+1,s.queue.length)}${item.steps?tr('stepOf',s.step+1,item.steps.length):''}</div><div class="track"><span style="width:${100*s.index/s.queue.length}%"></span></div><h2>${s.phase==='challenge'?tr('challengeHeading'):s.consolidation?tr('consolidationHeading'):tr('practiceHeading')}</h2>${item.context?`<div class="context"><div class="context-title">${tr('workContextTitle')}</div><div class="formula">${item.context}</div></div>`:''}${s.work?.length?`<ol class="work-trail">${s.work.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${novaMessage(enc[(s.index+s.step)%enc.length])}<div>${q.prompt}</div><form id="answerForm">${renderInputs(q,s)}<div class="actions">${q.type==='machine'?'':`<button type="submit" ${s.resolved?'disabled':''}>${tr('checkBtn')}</button>`}<button type="button" class="secondary" id="hint" ${s.resolved?'disabled':''}>${(s.hints||0)>=2?tr('seeSolution'):tr('needHint')}</button>${s.resolved?`<button type="button" id="advance">${tr('continueBtn')}</button>`:''}</div></form><div id="feedback" role="status" aria-live="polite" class="feedback ${s.resolved?(s.lastCorrect?'good':'bad'):s.attempts?'bad':''}">${s.feedback}</div><p class="small">${s.phase==='challenge'?tr('inputTipChallenge'):tr('inputTipPractice')}</p></section><div class="actions"><button class="secondary" id="backlearn">${tr('consultTheory')}</button>${s.phase!=='challenge'&&canChallenge()?`<button class="secondary" id="jump">${tr('goChallenge')}</button>`:''}</div>`;
 if(q.type==='choice')app.querySelectorAll('[name=choice]').forEach(input=>input.onchange=()=>{s.inputs=[input.value];save()});
 else if(q.type==='machine')renderMachine(q);
 else q.labels.forEach((_,i)=>{$('a'+i).value=s.inputs[i]||'';$('a'+i).oninput=()=>{s.inputs[i]=$('a'+i).value;save()}});
 $('answerForm').onsubmit=e=>{e.preventDefault();if(q.type!=='machine')check(q)};
 $('hint').onclick=()=>hint(q);
 if($('advance')){$('advance').onclick=advance;$('advance').focus()}
 else if(s.feedback)($('a0')||app.querySelector('[name=choice]'))?.focus();
 $('backlearn').onclick=showTheory;if($('jump'))$('jump').onclick=()=>start('challenge');
}

function check(q){
 const s=session();if(s.resolved)return;
 const a=q.type==='choice'?[parse(app.querySelector('[name=choice]:checked')?.value||'')]:q.labels.map((_,i)=>parse($('a'+i).value));
 if(a.some(x=>!Number.isFinite(x))||q.scientific&&!Number.isInteger(a[1])){$('feedback').textContent=q.type==='choice'?tr('pickOptionMsg'):tr('invalidNumberMsg');return}
 const rounded=q.rounded?norm(val(Number(q.expected[0].toPrecision(4)),q.expected[1])):null;
 const matches=expected=>a.every((x,i)=>q.scientific&&i===1?x===expected[i]:eq(x,expected[i]));
 const normalized=!q.scientific||(a[0]===0?a[1]===0:Math.abs(a[0])>=1&&Math.abs(a[0])<10);
 const correct=q.methodChoice||normalized&&(matches(q.expected)||rounded&&matches(rounded));
 if(correct){
  s.resolved=true;s.lastCorrect=true;
  const solution=q.methodChoice?chooseMethod(currentItem(),a[0]):q.solution;
  s.feedback='🌟 '+tr('congratulations')[(s.index+s.step)%tr('congratulations').length]+' '+solution;
  if(s.attempts===0){
   state.anyStreak++;state.bestAnyStreak=Math.max(state.bestAnyStreak,state.anyStreak);
   if((s.hints||0)===0&&!s.stepUsedTheory){
    state.noHintStreak++;state.bestNoHintStreak=Math.max(state.bestNoHintStreak,state.noHintStreak);
    if(!s.assisted){state.streak++;state.best=Math.max(state.streak,state.best)}
   }else{state.streak=0;state.noHintStreak=0}
  }else{state.streak=0;state.anyStreak=0;state.noHintStreak=0}
  syncLogros();
 }else{
  s.attempts++;s.assisted=true;s.hadMistake=true;state.streak=0;state.anyStreak=0;state.noHintStreak=0;
  if(s.attempts>=3){reveal(q,s)}
  else{s.feedback=tr('notYet')+transformFeedback(q,a[0])+(q.scientific&&eq(val(a[0],a[1]),val(...q.expected))?tr('notNormalized'):'')+(s.attempts===1?q.h1:q.h2)}
 }
 save();renderLevel();
}
function reveal(q,s){
 s.resolved=true;s.lastCorrect=false;s.hadMistake=true;
 s.feedback=tr('explainedSolution')+q.h2+'<br><strong>'+q.solution+'</strong>';
 if(q.methodChoice){s.feedback+=' '+chooseMethod(currentItem(),0)}
 if(s.phase!=='challenge')s.needsConsolidation=true;
 state.streak=0;state.anyStreak=0;state.noHintStreak=0;
}
function hint(q){
 const s=session();s.assisted=true;s.usedHint=true;s.hints=(s.hints||0)+1;
 state.streak=0;state.noHintStreak=0;
 if(s.hints>=3)reveal(q,s);else s.feedback='💡 '+(s.hints===1?q.h1:q.h2);
 save();renderLevel();
}
function resetStep(s){s.attempts=0;s.hints=0;s.inputs=[];s.feedback='';s.resolved=false;s.machineExp=undefined;s.stepUsedTheory=false}
function advance(){
 const s=session(),item=currentItem(),q=currentQuestion();if(!s.resolved)return;
 s.itemWrong=s.itemWrong||!s.lastCorrect;s.work=s.work||[];
 s.work.push(q.methodChoice?s.feedback:q.solution);
 if(item.steps&&s.step<item.steps.length-1)s.step++;
 else{
  if(!s.itemWrong)s.correct++;
  if(!s.itemWrong&&!s.assisted)s.score++;
  if(!s.itemWrong&&!s.assisted&&s.attempts===0)s.perfect++;
  const needs=s.needsConsolidation&&s.phase!=='challenge';
  if(!s.consolidation)s.index++;
  s.consolidation=needs?equivalent(item):null;
  s.step=0;s.assisted=false;s.itemWrong=false;s.needsConsolidation=false;s.work=[];
 }
 resetStep(s);save();renderLevel();
}
function finish(){
 const s=session();
 if(s.phase==='challenge'){
  if(s.score>=4){
   const stars=s.perfect===5?3:s.correct===5?2:1;
   state.done[level]=Math.max(state.done[level]||0,stars);
   if(!s.usedHint)state.logros.logro3=true;
  }
  if(!s.hadMistake)state.logros.logro4=true;
  s.phase='complete';syncLogros();save();renderLevel();
 }else{
  state.practiceDone[level]=true;save();
  $('content').innerHTML=`<section class="panel"><h2>${tr('trainingDoneTitle')}</h2>${novaMessage(tr('trainingDoneNova'))}<p>${tr('trainingDoneBody')}</p><div class="actions"><button id="challenge">${tr('startChallenge')}</button><button class="secondary" id="more">${tr('moreRandom')}</button><button class="secondary" id="review">${tr('reviewTheorySim')}</button><button class="secondary" id="fixedPractice">${tr('repeatPractice')}</button></div></section>`;
  $('challenge').onclick=()=>start('challenge');$('more').onclick=()=>start('extra');$('review').onclick=showTheory;$('fixedPractice').onclick=()=>start('practice');
 }
}

home();
</script></body></html>

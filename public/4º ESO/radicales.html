/* Pokemáticos Deterministic Reward Code Encoder (matches src/utils/rewardCodeUtils.js) */
function pkmCrc8(buf){let c=0xFF;for(let i=0;i<buf.length;i++){c^=buf[i];for(let j=0;j<8;j++)c=(c&0x80)?(((c<<1)^0x07)&0xFF):((c<<1)&0xFF)}return c^0xFF}
function pkmCrc32(str){let c=0xFFFFFFFF;for(let i=0;i<str.length;i++){c^=(str.charCodeAt(i)&0xFF);for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xEDB88320:0)}return (c^0xFFFFFFFF)>>>0}
function generateRewardCode(studentId,sourceId,activityId){
 if(!studentId||!sourceId||!activityId)throw new Error('Missing code parameters');
 const payload=[0x01],h=pkmCrc32(studentId);
 payload.push((h>>24)&0xFF,(h>>16)&0xFF,(h>>8)&0xFF,h&0xFF);
 const s=sourceId.substring(0,6).padEnd(6,' '),a=activityId.substring(0,6).padEnd(6,' ');
 for(let i=0;i<6;i++)payload.push(s.charCodeAt(i));
 for(let i=0;i<6;i++)payload.push(a.charCodeAt(i));
 payload.push(pkmCrc8(new Uint8Array(payload)));
 let n=0n;for(const b of payload)n=(n<<8n)|BigInt(b);
 const b36=n.toString(36).toUpperCase().padStart(28,'0');
 return `${b36.slice(0,4)}-${b36.slice(4,8)}-${b36.slice(8,12)}-${b36.slice(12,16)}-${b36.slice(16,20)}-${b36.slice(20,24)}-${b36.slice(24,28)}`;
}

function validateSave(data,opts={}){

 const sourceKinds=new Set(['rootSign','eqVsRoot','radToPow','powToRad','exactRoot','nestedRoot','powRadical','divSameIdx','errTrap','equivRed','commonScale','compareRad','extractFac','insertFac','combineRad','mulSameIdx','mulDiffIdx','ratCase1','ratCase2','ratMissingStep','conjSign','ratConjBinom','ratConjConstFirst','ratConjTwoRoots','plazaProblem']);

function getTheory(i){
 if(L()==='en')return [
  `<p>Taking an <em>n</em>-th root means finding the number that, raised to <strong>index n</strong>, equals the <strong>radicand a</strong>: ${rad('a','n')} = b ⇔ b<sup>n</sup> = a.</p><div class="example"><strong>Sign rules</strong><br>• <strong>Even index</strong> (${rad('16',4)} = 2): real root exists only if a ≥ 0, and the radical keeps only the non-negative value. If a &lt; 0 (${rad('−9')}), no real root exists.<br>• <strong>Odd index</strong> (${rad('−8',3)} = −2): always exists and keeps the sign of a.</div><div class="tip"><strong>Root vs Equation!</strong><br>${rad('25')} = <strong>5</strong> (a radical has one non-negative value), while solving x<sup>2</sup> = 25 gives <strong>x = ±5</strong>. Also ${rad('(−7)<sup>2</sup>')} = |−7| = 7.</div><div id="sim1"></div>`,
  `<p>Any radical can be written as a fractional power (for a &gt; 0): <strong>the denominator is the index</strong>, and <strong>the numerator is the radicand exponent</strong>.</p><div class="formula">${powf('a','m','n')} = ${rad('a<sup>m</sup>','n')} &nbsp;&nbsp;|&nbsp;&nbsp; ${powf('a','−m','n')} = ${frac(1,rad('a<sup>m</sup>','n'))}</div><div class="example">${rad('3<sup>2</sup>',5)} = ${powf(3,2,5)}<br>${frac(1,rad('x'))} = ${powf('x','−1',2)}<br>${powf(8,2,3)} = (${rad(8,3)})<sup>2</sup> = 2<sup>2</sup> = 4<br>${rad('27<sup>2</sup>',3)} = (${rad(27,3)})<sup>2</sup> = 3<sup>2</sup> = 9</div><div class="tip">Tip: compute the root first when evaluating exact numbers (${rad('625',4)} = 5 because 5<sup>4</sup> = 625) before raising to the power!</div>`,
  `<p>Two key rules follow directly from fractional exponents (a &gt; 0):</p><div class="example"><strong>1. Power of a radical</strong><br>(${rad('a','n')})<sup>m</sup> = ${rad('a<sup>m</sup>','n')} = ${powf('a','m','n')}<br>Example: (${rad(5,3)})<sup>6</sup> = ${powf(5,6,3)} = 5<sup>2</sup> = 25.</div><div class="example"><strong>2. Root of a root</strong> (multiply the indices!)<br>${rad(rad('a','n'),'m')} = ${rad('a','m·n')}<br>Example: ${rad(rad(64,2),3)} = ${rad(64,6)} = 2.</div><div class="tip"><strong>Avoid the classic trap!</strong> Roots do NOT split across addition: ${rad('9 + 16')} = ${rad(25)} = 5, whereas ${rad(9)} + ${rad(16)} = 3 + 4 = 7.</div>`,
  `<p>Different radicals can represent the same value: multiply or divide both <strong>index</strong> and <strong>radicand exponent</strong> by the same positive integer k.</p><div class="formula">${rad('a<sup>m</sup>','n')} = ${rad('a<sup>m·k</sup>','n·k')}</div><div class="example"><strong>Simplify with GCD:</strong> ${rad('5<sup>4</sup>',6)} = ${rad('5<sup>2</sup>',3)} (divided 6 and 4 by 2).<br><strong>Scale to a common index with LCM:</strong> to combine or compare ${rad(3)} and ${rad(2,3)}, use LCM(2, 3) = 6:<br>${rad(3)} = ${rad('3<sup>3</sup>',6)} = ${rad(27,6)} &nbsp;and&nbsp; ${rad(2,3)} = ${rad('2<sup>2</sup>',6)} = ${rad(4,6)}. So ${rad(3)} &gt; ${rad(2,3)}!</div><div id="sim4"></div>`,
  `<p>To simplify a radical, factor the radicand into prime powers and <strong>divide each exponent by the index n</strong>: the <em>quotient comes outside</em> and the <em>remainder stays inside</em>.</p><div class="example">• ${rad(72)} = ${rad('36 · 2')} = ${rad(2,2,6)}<br>• ${rad(54,3)} = ${rad('27 · 2',3)} = ${rad(2,3,3)}</div><div class="tip"><strong>Inserting a factor inside:</strong> raise it to index n: k·${rad('a','n')} = ${rad('k<sup>n</sup> · a','n')}.<br>Watch out for negatives on even roots: <strong>−2${rad(3)} = −${rad(12)}</strong> (the minus stays outside!).</div><div id="sim5"></div>`,
  `<p><strong>Adding &amp; Subtracting:</strong> Only <em>like radicals</em> (same index and same radicand) can be combined. Simplify by extracting factors first!</p><div class="example">${rad(12)} + ${rad(27)} = 2${rad(3)} + 3${rad(3)} = 5${rad(3)}<br>${rad(50)} − ${rad(8)} + ${rad(18)} = 5${rad(2)} − 2${rad(2)} + 3${rad(2)} = 6${rad(2)}</div><p><strong>Multiplying &amp; Dividing:</strong> If indices match, operate coefficients outside and radicands inside. If indices differ, reduce to a common index (LCM) first.</p><div class="example">2${rad(3)} · 3${rad(6)} = 6${rad(18)} = 18${rad(2)}<br>${rad(2)} · ${rad(4,3)} = ${rad(8,6)} · ${rad(16,6)} = ${rad(128,6)} = 2${rad(2,6)}</div>`,
  `<p><strong>Rationalizing</strong> means eliminating radicals from the denominator by multiplying top and bottom by the same expression (= 1).</p><div class="example"><strong>Case 1 · Square root:</strong> ${frac(5,rad(3))} · ${frac(rad(3),rad(3))} = ${frac('5'+rad(3),3)}.<br>If there is a common factor, simplify first: ${frac(6,'2'+rad(5))} = ${frac(3,rad(5))} = ${frac('3'+rad(5),5)}.</div><div class="example"><strong>Case 2 · Higher index (${rad('a<sup>m</sup>','n')}):</strong> Complete up to exponent <em>n</em> by multiplying by ${rad('a<sup>n−m</sup>','n')}!<br>${frac(2,rad(5,3))} · ${frac(rad('5<sup>2</sup>',3),rad('5<sup>2</sup>',3))} = ${frac('2'+rad(25,3),5)} &nbsp;|&nbsp; ${frac(3,rad('2<sup>3</sup>',5))} · ${frac(rad('2<sup>2</sup>',5),rad('2<sup>2</sup>',5))} = ${frac('3'+rad(4,5),2)}</div>`,
  `<p><strong>Case 3 · Binomial with square roots:</strong> Multiply numerator and denominator by the <strong>conjugate</strong> (flip the middle sign) to trigger a difference of squares: <strong>(a + b)(a − b) = a<sup>2</sup> − b<sup>2</sup></strong>.</p><div class="example">${frac(3,rad(5)+' + 2')} · ${frac(rad(5)+' − 2',rad(5)+' − 2')} = ${frac('3('+rad(5)+' − 2)','5 − 4')} = 3${rad(5)} − 6<br>${frac(1,rad(7)+' − '+rad(2))} · ${frac(rad(7)+' + '+rad(2),rad(7)+' + '+rad(2))} = ${frac(rad(7)+' + '+rad(2),'7 − 2')} = ${frac(rad(7)+' + '+rad(2),5)}</div><div class="tip"><strong>Real-world geometry:</strong> A square plaza has area 98 m<sup>2</sup>. Side = ${rad(98)} = 7${rad(2)} m. Diagonal = ${rad('98 + 98')} = ${rad(196)} = 14 m exact!</div>`
 ][i];
 return [
  `<p>Calcular una raíz de <strong>índice n</strong> es buscar el número que, elevado a n, da el <strong>radicando a</strong>: ${rad('a','n')} = b ⇔ b<sup>n</sup> = a.</p><div class="example"><strong>Reglas de signo</strong><br>• <strong>Índice par</strong> (${rad('16',4)} = 2): solo existe raíz real si a ≥ 0 y el radical toma el valor positivo (o cero). Si a &lt; 0 (${rad('−9')}), no existe raíz real.<br>• <strong>Índice impar</strong> (${rad('−8',3)} = −2): siempre existe y conserva el signo de a.</div><div class="tip"><strong>¿Una raíz o dos soluciones?</strong><br>${rad('25')} = <strong>5</strong> (solo el valor positivo), mientras que la ecuación x<sup>2</sup> = 25 tiene dos soluciones: <strong>x = ±5</strong>. Además, ${rad('(−7)<sup>2</sup>')} = |−7| = 7.</div><div id="sim1"></div>`,
  `<p>Todo radical puede escribirse como potencia fraccionaria (con a &gt; 0): <strong>el denominador indica el índice</strong> y <strong>el numerador, el exponente del radicando</strong>.</p><div class="formula">${powf('a','m','n')} = ${rad('a<sup>m</sup>','n')} &nbsp;&nbsp;|&nbsp;&nbsp; ${powf('a','−m','n')} = ${frac(1,rad('a<sup>m</sup>','n'))}</div><div class="example">${rad('3<sup>2</sup>',5)} = ${powf(3,2,5)}<br>${frac(1,rad('x'))} = ${powf('x','−1',2)}<br>${powf(8,2,3)} = (${rad(8,3)})<sup>2</sup> = 2<sup>2</sup> = 4<br>${rad('27<sup>2</sup>',3)} = (${rad(27,3)})<sup>2</sup> = 3<sup>2</sup> = 9</div><div class="tip">Truco: al calcular raíces exactas (${rad('625',4)} = 5 porque 5<sup>4</sup> = 625), haz primero la raíz y luego la potencia.</div>`,
  `<p>Estas dos propiedades salen directamente de los exponentes fraccionarios (a &gt; 0):</p><div class="example"><strong>1. Potencia de un radical</strong><br>(${rad('a','n')})<sup>m</sup> = ${rad('a<sup>m</sup>','n')} = ${powf('a','m','n')}<br>Ejemplo: (${rad(5,3)})<sup>6</sup> = ${powf(5,6,3)} = 5<sup>2</sup> = 25.</div><div class="example"><strong>2. Raíz de raíz</strong> (¡multiplica los índices!)<br>${rad(rad('a','n'),'m')} = ${rad('a','m·n')}<br>Ejemplo: ${rad(rad(64,2),3)} = ${rad(64,6)} = 2.</div><div class="tip"><strong>¡Error que debes evitar!</strong> La raíz NO se reparte en la suma: ${rad('9 + 16')} = ${rad(25)} = 5, mientras que ${rad(9)} + ${rad(16)} = 3 + 4 = 7.</div>`,
  `<p>Dos radicales distintos son equivalentes si tienen el mismo valor: multiplica o divide el <strong>índice</strong> y el <strong>exponente</strong> por el mismo número natural k ≠ 0.</p><div class="formula">${rad('a<sup>m</sup>','n')} = ${rad('a<sup>m·k</sup>','n·k')}</div><div class="example"><strong>Simplificar con el m.c.d.:</strong> ${rad('5<sup>4</sup>',6)} = ${rad('5<sup>2</sup>',3)} (dividimos 6 y 4 entre 2).<br><strong>Reducir a índice común con el m.c.m.:</strong> para ${rad(3)} y ${rad(2,3)}, m.c.m.(2, 3) = 6:<br>${rad(3)} = ${rad('3<sup>3</sup>',6)} = ${rad(27,6)} &nbsp;y&nbsp; ${rad(2,3)} = ${rad('2<sup>2</sup>',6)} = ${rad(4,6)}. Así vemos que ${rad(3)} &gt; ${rad(2,3)}.</div><div id="sim4"></div>`,
  `<p>Para extraer factores, descompón el radicando en factores primos y <strong>divide cada exponente entre el índice n</strong>: el <em>cociente sale fuera</em> y el <em>resto queda dentro</em>.</p><div class="example">• ${rad(72)} = ${rad('36 · 2')} = ${rad(2,2,6)}<br>• ${rad(54,3)} = ${rad('27 · 2',3)} = ${rad(2,3,3)}</div><div class="tip"><strong>Introducir factores dentro:</strong> elévalo al índice n: k·${rad('a','n')} = ${rad('k<sup>n</sup> · a','n')}.<br>Ojo en índices pares: <strong>−2${rad(3)} = −${rad(12)}</strong> (el signo menos se queda fuera).</div><div id="sim5"></div>`,
  `<p><strong>Suma y resta:</strong> Solo se combinan <em>radicales semejantes</em> (mismo índice y mismo radicando). Simplifica primero extrayendo factores.</p><div class="example">${rad(12)} + ${rad(27)} = 2${rad(3)} + 3${rad(3)} = 5${rad(3)}<br>${rad(50)} − ${rad(8)} + ${rad(18)} = 5${rad(2)} − 2${rad(2)} + 3${rad(2)} = 6${rad(2)}</div><p><strong>Multiplicación y división:</strong> Si tienen el mismo índice, opera los coeficientes por fuera y los radicandos por dentro. Si difieren, reduce a índice común (m.c.m.).</p><div class="example">2${rad(3)} · 3${rad(6)} = 6${rad(18)} = 18${rad(2)}<br>${rad(2)} · ${rad(4,3)} = ${rad(8,6)} · ${rad(16,6)} = ${rad(128,6)} = 2${rad(2,6)}</div>`,
  `<p><strong>Racionalizar</strong> es quitar los radicales del denominador multiplicando numerador y denominador por la misma expresión (= 1).</p><div class="example"><strong>Caso 1 · Raíz cuadrada:</strong> ${frac(5,rad(3))} · ${frac(rad(3),rad(3))} = ${frac('5'+rad(3),3)}.<br>Si puedes, simplifica antes: ${frac(6,'2'+rad(5))} = ${frac(3,rad(5))} = ${frac('3'+rad(5),5)}.</div><div class="example"><strong>Caso 2 · Índice superior (${rad('a<sup>m</sup>','n')}):</strong> Completa los factores hasta llegar al exponente <em>n</em> multiplicando por ${rad('a<sup>n−m</sup>','n')}:<br>${frac(2,rad(5,3))} · ${frac(rad('5<sup>2</sup>',3),rad('5<sup>2</sup>',3))} = ${frac('2'+rad(25,3),5)} &nbsp;|&nbsp; ${frac(3,rad('2<sup>3</sup>',5))} · ${frac(rad('2<sup>2</sup>',5),rad('2<sup>2</sup>',5))} = ${frac('3'+rad(4,5),2)}</div>`,
  `<p><strong>Caso 3 · Binomio con raíces cuadradas:</strong> Multiplica arriba y abajo por el <strong>conjugado</strong> (cambia el signo del segundo término) para usar la diferencia de cuadrados: <strong>(a + b)(a − b) = a<sup>2</sup> − b<sup>2</sup></strong>.</p><div class="example">${frac(3,rad(5)+' + 2')} · ${frac(rad(5)+' − 2',rad(5)+' − 2')} = ${frac('3('+rad(5)+' − 2)','5 − 4')} = 3${rad(5)} − 6<br>${frac(1,rad(7)+' − '+rad(2))} · ${frac(rad(7)+' + '+rad(2),rad(7)+' + '+rad(2))} = ${frac(rad(7)+' + '+rad(2),'7 − 2')} = ${frac(rad(7)+' + '+rad(2),5)}</div><div class="tip"><strong>Situación real:</strong> Una plaza cuadrada tiene 98 m<sup>2</sup> de área. Lado = ${rad(98)} = 7${rad(2)} m. Diagonal = ${rad('98 + 98')} = ${rad(196)} = 14 m exactos.</div>`
 ][i];
}

function runSim(lvl){
 if(lvl===0&&$('sim1')){
  let n=2,a=16;
  const draw=()=>{
   const odd=n%2===1,abs=Math.abs(a),base=abs===0?0:abs===16?2:3;
   const rVal=a===0?0:(a<0?(odd?-base:null):base);
   const eqVal=a===0?'0':(a<0?(odd?`${-base}`:tr('sim1NoEq')):(odd?`${base}`:`±${base}`));
   const note=odd?tr('sim1NoteOdd'):(a>=0?tr('sim1NoteEvenPos'):tr('sim1NoteEvenNeg'));
   $('sim1').innerHTML=`<div class="sim"><strong>${tr('sim1Title')}</strong><div class="formula">${rad(a,n)} = ${rVal===null?tr('sim1NoReal'):rVal} &nbsp;|&nbsp; x<sup>${n}</sup> = ${a} ⇒ x = ${eqVal}</div><div class="actions" style="justify-content:center"><button type="button" class="${n===2?'':'secondary'}" id="s1n2">n = 2</button><button type="button" class="${n===3?'':'secondary'}" id="s1n3">n = 3</button><button type="button" class="${n===4?'':'secondary'}" id="s1n4">n = 4</button></div><div class="actions" style="justify-content:center"><button type="button" class="${a===16?'':'secondary'}" id="s1a16">a = 16</button><button type="button" class="${a===-16?'':'secondary'}" id="s1am16">a = −16</button><button type="button" class="${a===27?'':'secondary'}" id="s1a27">a = 27</button><button type="button" class="${a===-27?'':'secondary'}" id="s1am27">a = −27</button></div><p class="small">${note}</p></div>`;
   $('s1n2').onclick=()=>{n=2;a=(Math.abs(a)===27?16:a);draw()};
   $('s1n3').onclick=()=>{n=3;a=(Math.abs(a)===16?27:a);draw()};
   $('s1n4').onclick=()=>{n=4;a=(Math.abs(a)===27?16:a);draw()};
   $('s1a16').onclick=()=>{a=16;if(n===3)n=2;draw()};
   $('s1am16').onclick=()=>{a=-16;if(n===3)n=2;draw()};
   $('s1a27').onclick=()=>{a=27;n=3;draw()};
   $('s1am27').onclick=()=>{a=-27;n=3;draw()};
  };draw();
 }
 if(lvl===3&&$('sim4')){
  let step=0;
  const msgs=()=>[
   `${rad(3)} &nbsp;&amp;&nbsp; ${rad(2,3)}`,
   `${rad(3)} = ${rad('3<sup>3</sup>',6)} = ${rad(27,6)} &nbsp;|&nbsp; ${rad(2,3)} = ${rad('2<sup>2</sup>',6)} = ${rad(4,6)}`,
   `${rad(27,6)} &gt; ${rad(4,6)} &nbsp;·&nbsp; ${rad(27,6)} · ${rad(4,6)} = ${rad(108,6)}`
  ];
  const draw=()=>{
   $('sim4').innerHTML=`<div class="sim"><strong>${tr('sim4Title')}</strong><p class="small">${tr('sim4Step'+step)}</p><div class="formula">${msgs()[step]}</div><div class="actions" style="justify-content:center"><button type="button" id="s4next" ${step>=2?'disabled':''}>${tr('sim4Btn')}</button><button type="button" id="s4rst" class="secondary">${tr('sim4Reset')}</button></div></div>`;
   $('s4next').onclick=()=>{if(step<2){step++;draw()}};$('s4rst').onclick=()=>{step=0;draw()};
  };draw();
 }
 if(lvl===4&&$('sim5')){
  let m=5,n=2;
  const draw=()=>{
   const q=Math.floor(m/n),rem=m%n;
   const expr=`${rad(`2<sup>${m}</sup>`,n)} = ${q?`2<sup>${q}</sup>`:''}${rem?rad(rem===1?'2':`2<sup>${rem}</sup>`,n):''}`;

function conjSign(aText,bText,sign){
 const en=L()==='en',opp=sign==='+'?'−':'+';
 const opts=[`${aText} ${opp} ${bText}`,`${aText} ${sign} ${bText}`,`−${aText} ${sign} ${bText}`];
 const shift=(aText.length+bText.length+(sign==='+'?1:2))%3,choices=opts.map((_,i)=>opts[(i+shift)%3]),ans=choices.indexOf(opts[0]);
 return qChoice(`${en?'What is the conjugate of this denominator?':'¿Cuál es el conjugado de este denominador?'}<div class="formula">${aText} ${sign} ${bText}</div>`,choices,ans,en?'Change ONLY the sign between the two terms.':'Cambia SOLO el signo del segundo término.',en?`Flip ${sign} to ${opp}.`:`Cambia ${sign} por ${opp}.`,`${aText} ${opp} ${bText}`,{kind:'conjSign',args:[aText,bText,sign]});
}
function ratConjBinom(num,r,c,cSign){
 // num / (sqrt(r) + cSign*c) or num / (c + cSign*sqrt(r)) -> integer result a*sqrt(r) + b!
 // Mode A (cSign '+' or '-'): num / (sqrt(r) + c) where c can be positive or negative -> denom = r - c*c
 const en=L()==='en',denom=r-(c*c),k=num/denom,conjC=-c,coef=k,constTerm=k*conjC;
 const denText=`${rad(r)} ${c>=0?'+':'−'} ${Math.abs(c)}`;
 const conjText=`${rad(r)} ${conjC>=0?'+':'−'} ${Math.abs(conjC)}`;
 const solText=`${coef===1?'':coef}${rad(r)} ${constTerm>=0?'+':'−'} ${Math.abs(constTerm)}`;
 return qBinom(`${en?'Rationalize using the conjugate and simplify:':'Racionaliza con el conjugado y simplifica:'}<div class="formula">${frac(num,denText)}</div>`,r,coef,constTerm,en?`Multiply top and bottom by the conjugate (${conjText}).`:`Multiplica arriba y abajo por el conjugado (${conjText}).`,en?`Denominator becomes ${r} − ${c*c} = ${denom}. Divide ${num} by ${denom} and distribute.`:`El denominador da ${r} − ${c*c} = ${denom}. Divide ${num} entre ${denom} y desarrolla.`,`${frac(num,denText)} = ${solText}`,{kind:'ratConjBinom',args:[num,r,c,cSign]});
}
function ratConjConstFirst(num,c,r,sign){
 // num / (c - sqrt(r)) where c^2 - r divides num -> result = coef*sqrt(r) + constTerm
 const en=L()==='en',denom=(c*c)-r,k=num/denom,coef=sign==='−'?k:-k,constTerm=k*c;
 const denText=`${c} ${sign} ${rad(r)}`;
 const opp=sign==='−'?'+':'−';
 const solText=`${constTerm} ${coef>=0?'+':'−'} ${Math.abs(coef)===1?'':Math.abs(coef)}${rad(r)}`;
 return qBinom(`${en?'Rationalize using the conjugate and simplify:':'Racionaliza con el conjugado y simplifica:'}<div class="formula">${frac(num,denText)}</div>`,r,coef,constTerm,en?`Multiply by (${c} ${opp} ${rad(r)}).`:`Multiplica por (${c} ${opp} ${rad(r)}).`,en?`Denominator becomes ${c*c} − ${r} = ${denom}.`:`El denominador da ${c*c} − ${r} = ${denom}.`,`${frac(num,denText)} = ${solText}`,{kind:'ratConjConstFirst',args:[num,c,r,sign]});
}
function ratConjTwoRoots(num,a,b,sign){
 // num / (sqrt(a) +/- sqrt(b)) simplified match
 const en=L()==='en',opp=sign==='−'?'+':'−',denom=Math.abs(a-b);
 const denText=`${rad(a)} ${sign} ${rad(b)}`;
 const right=frac(`${num===1?'':num+'('}${rad(a)} ${opp} ${rad(b)}${num===1?'':')'}`,a>b?denom:`−${denom}`);
 const cleanAns=denom===num?`${rad(a)} ${opp} ${rad(b)}`:frac(`${num===1?'':num}(${rad(a)} ${opp} ${rad(b)})`,denom);

function plazaProblem(k,part){

function relocalizeItem(item){
 const src=item?.source;if(!src)return item;

 if(!map[src.kind])return item;
 const fresh=map[src.kind](...src.args);
 if(item.consolidation)fresh.consolidation=true;
 return fresh;
}
function relocalizeSessions(){
 for(const s of Object.values(state.sessions)){
  s.queue=s.queue.map(relocalizeItem);
  if(s.consolidation)s.consolidation=relocalizeItem(s.consolidation);
  const active=s.consolidation||s.queue[s.index];
  if(active){
   if(s.resolved)s.feedback=s.lastCorrect?('🌟 '+pick(tr('congratulations'))+' '+active.solution):(tr('explainedSolution')+active.h2+'<br><strong>'+active.solution+'</strong>');
   else if((s.hints||0)>0)s.feedback='💡 '+(s.hints===1?active.h1:active.h2);
   else if(s.attempts>0)s.feedback=tr('notYet')+(s.attempts===1?active.h1:active.h2);
  }
 }
}
function equivalent(item){

}

 const title=s.consolidation?tr('consolidationTag'):s.phase==='challenge'?tr('challengeTag'):s.phase==='extra'?tr('extraTag'):tr('practiceTag');
 const enc=tr('encouragement');
 $('content').innerHTML=`<section class="panel"><div class="tag">${title}${s.consolidation?'':tr('exerciseOf',s.index+1,s.queue.length)}${item.steps?tr('stepOf',s.step+1,item.steps.length):''}</div><div class="track"><span style="width:${100*s.index/s.queue.length}%"></span></div><h2>${s.phase==='challenge'?tr('challengeHeading'):s.consolidation?tr('consolidationHeading'):tr('practiceHeading')}</h2>${novaMessage(enc[(s.index+s.step)%enc.length])}<div>${q.prompt}</div><form id="answerForm">${renderInputs(q,s)}<div class="actions"><button type="submit" ${s.resolved?'disabled':''}>${tr('checkBtn')}</button><button type="button" class="secondary" id="hint" ${s.resolved?'disabled':''}>${(s.hints||0)>=2?tr('seeSolution'):tr('needHint')}</button>${s.resolved?`<button type="button" id="advance">${tr('continueBtn')}</button>`:''}</div></form><div id="feedback" role="status" aria-live="polite" class="feedback ${s.resolved?(s.lastCorrect?'good':'bad'):s.attempts?'bad':''}">${s.feedback}</div><p class="small">${s.phase==='challenge'?tr('inputTipChallenge'):tr('inputTipPractice')}</p></section><div class="actions"><button class="secondary" id="backlearn">${tr('consultTheory')}</button>${s.phase!=='challenge'&&canChallenge()?`<button class="secondary" id="jump">${tr('goChallenge')}</button>`:''}</div>`;
 if(q.type==='choice')app.querySelectorAll('[name=choice]').forEach(input=>input.onchange=()=>{s.inputs=[input.value];save()});
 else q.labels.forEach((_,i)=>{$('a'+i).value=s.inputs[i]||'';$('a'+i).oninput=()=>{s.inputs[i]=$('a'+i).value;save()}});
 $('answerForm').onsubmit=e=>{e.preventDefault();check(q)};
 $('hint').onclick=()=>hint(q);
 if($('advance')){$('advance').onclick=advance;$('advance').focus()}
 else if(s.feedback)($('a0')||app.querySelector('[name=choice]'))?.focus();
 $('backlearn').onclick=showTheory;if($('jump'))$('jump').onclick=()=>start('challenge');
}

function parseIntStrict(raw){
 const s=String(raw||'').trim().replace('−','-');
 if(!/^[-+]?\d+$/.test(s))return NaN;
 const v=Number(s);return Number.isSafeInteger(v)?v:NaN;
}

function check(q){
 const s=session();if(s.resolved)return;
 const a=q.type==='choice'?[parseIntStrict(app.querySelector('[name=choice]:checked')?.value||'')]:q.labels.map((_,i)=>parseIntStrict($('a'+i).value));
 if(a.some(x=>!Number.isInteger(x))){$('feedback').textContent=q.type==='choice'?tr('pickOptionMsg'):tr('invalidIntMsg');return}
 let diag='',correct=false;
 if(q.type==='choice'||q.type==='scalar'||q.type==='binom'){
  correct=a.every((v,i)=>eq(v,q.expected[i]));
 }else if(q.type==='power'){
  if(a[1]<=0){$('feedback').textContent=tr('zeroDenMsg');return}
  if(a[0]*q.expected[1]===q.expected[0]*a[1]){
   if(gcd(a[0],a[1])>1)diag=tr('notSimplifiedFrac')+' ';
   else correct=true;
  }
 }else if(q.type==='radpow'){
  if(a[0]<2){$('feedback').textContent=tr('badIdxMsg');return}
  if(a[0]*q.expected[1]===q.expected[0]*a[1]){
   if(a[0]!==q.expected[0])diag=tr('notReducedIdx')+' ';
   else correct=true;
  }
 }else if(q.type==='radical'){
  if(eq(a[0],q.expected[0])&&eq(a[1],q.expected[1]))correct=true;
  else if(a[1]>0&&((a[0]**q.idx)*a[1])===((q.expected[0]**q.idx)*q.expected[1])&&Math.sign(a[0])===Math.sign(q.expected[0]))diag=tr('notExtractedAll')+' ';
 }else if(q.type==='ratfrac'){
  if(a[2]<=0){$('feedback').textContent=tr('zeroDenMsg');return}
  if(eq(a[0],q.expected[0])&&eq(a[1],q.expected[1])&&eq(a[2],q.expected[2]))correct=true;
  else if(a[1]===q.expected[1]&&a[0]*q.expected[2]===q.expected[0]*a[2])diag=tr('notRatSimplified')+' ';
 }
 if(correct){
  s.resolved=true;s.lastCorrect=true;
  s.feedback='🌟 '+pick(tr('congratulations'))+' '+q.solution;
  if(s.attempts===0){
   state.anyStreak++;state.bestAnyStreak=Math.max(state.bestAnyStreak,state.anyStreak);
   if((s.hints||0)===0&&!s.stepUsedTheory){
    state.noHintStreak++;state.bestNoHintStreak=Math.max(state.bestNoHintStreak,state.noHintStreak);
    if(!s.assisted){state.streak++;state.best=Math.max(state.streak,state.best)}
   }else{state.streak=0;state.noHintStreak=0}
  }else{state.streak=0;state.anyStreak=0;state.noHintStreak=0}
  syncLogros();
 }else{
  s.attempts++;s.assisted=true;s.hadMistake=true;state.streak=0;state.anyStreak=0;state.noHintStreak=0;
  if(s.attempts>=3)reveal(q,s);
  else s.feedback=tr('notYet')+diag+(s.attempts===1?q.h1:q.h2);
 }
 save();renderLevel();
}
function reveal(q,s){
 s.resolved=true;s.lastCorrect=false;s.hadMistake=true;
 s.feedback=tr('explainedSolution')+q.h2+'<br><strong>'+q.solution+'</strong>';
 if(s.phase!=='challenge')s.needsConsolidation=true;
 state.streak=0;state.anyStreak=0;state.noHintStreak=0;
}
function hint(q){
 const s=session();s.assisted=true;s.usedHint=true;s.hints=(s.hints||0)+1;
 state.streak=0;state.noHintStreak=0;
 if(s.hints>=3)reveal(q,s);else s.feedback='💡 '+(s.hints===1?q.h1:q.h2);
 save();renderLevel();
}
function resetStep(s){s.attempts=0;s.hints=0;s.inputs=[];s.feedback='';s.resolved=false;s.stepUsedTheory=false}
function advance(){
 const s=session(),item=currentItem(),q=currentQuestion();if(!s.resolved)return;
 s.itemWrong=s.itemWrong||!s.lastCorrect;s.work=s.work||[];s.work.push(q.solution);
 if(item.steps&&s.step<item.steps.length-1)s.step++;
 else{
  if(!s.itemWrong)s.correct++;
  if(!s.itemWrong&&!s.assisted)s.score++;
  if(!s.itemWrong&&!s.assisted&&s.attempts===0)s.perfect++;
  const needs=s.needsConsolidation&&s.phase!=='challenge';
  if(!s.consolidation)s.index++;
  s.consolidation=needs?equivalent(item):null;
  s.step=0;s.assisted=false;s.itemWrong=false;s.needsConsolidation=false;s.work=[];
 }
 resetStep(s);save();renderLevel();
}
function finish(){
 const s=session();
 if(s.phase==='challenge'){
  if(s.score>=4){
   const stars=s.perfect===5?3:s.correct===5?2:1;
   state.done[level]=Math.max(state.done[level]||0,stars);
   if(!s.usedHint)state.logros.sinpi3=true;
  }
  if(!s.hadMistake&&(level===6||level===7))state.logros.racex4=true;
  s.phase='complete';syncLogros();save();renderLevel();
 }else{
  state.practiceDone[level]=true;save();
  $('content').innerHTML=`<section class="panel"><h2>${tr('trainingDoneTitle')}</h2>${novaMessage(tr('trainingDoneNova'))}<p>${tr('trainingDoneBody')}</p><div class="actions"><button id="challenge">${tr('startChallenge')}</button><button class="secondary" id="more">${tr('moreRandom')}</button><button class="secondary" id="review">${tr('reviewTheorySim')}</button><button class="secondary" id="fixedPractice">${tr('repeatPractice')}</button></div></section>`;
  $('challenge').onclick=()=>start('challenge');$('more').onclick=()=>start('extra');$('review').onclick=showTheory;$('fixedPractice').onclick=()=>start('practice');
 }
}

home();
</script></body></html>
